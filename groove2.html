<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Synth Groovebox</title>
<style>
  :root { --bg:#101018; --panel:#1b1b26; --cell:#2a2a38; --on:#ff4d6d; --accent:#ffd166; --text:#f4f1ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(160deg,#0d0d14,#171427 55%,#101018); color:var(--text); font-family:system-ui,Segoe UI,Arial; }
  header { padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid #ffffff22; }
  h1 { font-size:18px; margin:0; letter-spacing:.08em; text-transform:uppercase; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 18px; background:#ffffff0d; border-bottom:1px solid #ffffff18; }
  button, select { background:#252536; color:var(--text); border:1px solid #ffffff2a; border-radius:10px; padding:10px 12px; font-weight:700; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #play { background:var(--accent); color:#20180a; min-width:96px; }
  label { display:flex; align-items:center; gap:8px; font-size:13px; }
  input[type=range] { width:130px; accent-color:var(--accent); }
  main { padding:14px 18px 24px; overflow:auto; }
  .grid { display:grid; gap:6px; min-width:880px; }
  .row { display:grid; grid-template-columns:118px repeat(16, 1fr); gap:6px; align-items:center; }
  .lane { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#ddd; padding:10px 8px; background:var(--panel); border-radius:10px; }
  .cell { aspect-ratio:1/1; min-height:34px; border:0; border-radius:8px; background:var(--cell); position:relative; }
  .cell.on { background:var(--on); box-shadow:0 0 14px #ff4d6d66; }
  .cell.active { outline:2px solid #fff; }
  .cell:nth-child(4n+1) { filter:brightness(1.18); }
  .footer { color:#b9b4c8; font-size:12px; padding:0 18px 16px; }
</style>
</head>
<body>
<header>
  <h1>Synth Groovebox</h1>
  <div>Web Audio • MIDI-ready • 16 steps</div>
</header>

<div class="toolbar">
  <button id="play">▶ Play</button>
  <label>BPM <input id="bpm" type="range" min="60" max="180" value="112"><span id="bpmVal">112</span></label>
  <label>Swing <input id="swing" type="range" min="0" max="60" value="18"><span id="swingVal">18%</span></label>
  <button id="random">Random</button>
  <button id="clear">Clear</button>
  <button id="preset">Preset</button>
  <button id="midi">Enable MIDI Out</button>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>
<div class="footer">Click cells to toggle. Click a cell’s lane name to trigger it. Space = play/stop. MIDI works in Chrome/Edge with a MIDI output; otherwise the sound is synthesized locally.</div>

<script>
const STEPS = 16;
const lanes = [
  { id:'kick', name:'Kick', midi:36, prob:.42, type:'kick' },
  { id:'snare', name:'Snare', midi:38, prob:.30, type:'snare' },
  { id:'clap', name:'Clap', midi:39, prob:.22, type:'clap' },
  { id:'hat', name:'Hat', midi:42, prob:.62, type:'hat' },
  { id:'open', name:'Open Hat', midi:46, prob:.16, type:'openHat' },
  { id:'bass', name:'Bass', midi:36, prob:.45, type:'bass' },
  { id:'synth', name:'Synth', midi:64, prob:.38, type:'synth' },
  { id:'arp', name:'Arp', midi:69, prob:.48, type:'arp' },
];
let pattern = lanes.map(() => Array(STEPS).fill(false));
let audioCtx, master, noiseBuf, playing=false, step=0, nextTime=0, timer=null;
let bpm=112, swing=.18, midiOut=null;

const grid = document.getElementById('grid');
const playBtn=document.getElementById('play');

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  master = audioCtx.createGain();
  master.gain.value = .82;
  master.connect(audioCtx.destination);
  const len = audioCtx.sampleRate * 1.2;
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
}

function schedule(fn, t=0) {
  const time = audioCtx.currentTime + t;
  fn(time);
}

function kick(t) {
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(38,t+.12);
  g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g).connect(master); o.start(t); o.stop(t+.26);
}
function noise(t, dur, hp, gain=.7) {
  const src=audioCtx.createBufferSource(); src.buffer=noiseBuf;
  const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t+dur+.02);
}
function snare(t) { noise(t,.16,1800,.75); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(190,t); g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.11); o.connect(g).connect(master); o.start(t); o.stop(t+.12); }
function clap(t) { [0,.012,.026].forEach((x,i)=>noise(t+x,.12,1100,.45-i*.1)); }
function hat(t) { noise(t,.055,7500,.32); }
function openHat(t) { noise(t,.32,6500,.36); }
function bass(t) {
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  o.type='sawtooth'; o.frequency.setValueAtTime(55,t); f.type='lowpass'; f.frequency.setValueAtTime(700,t); f.frequency.exponentialRampToValueAtTime(120,t+.25);
  g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.7,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+.34);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+.36);
}
function synth(t) {
  const notes=[220,261.63,329.63];
  notes.forEach((fq,i)=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
    o.type='square'; o.frequency.value=fq*(1+i*.003); f.type='lowpass'; f.frequency.value=1200;
    g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.16,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+.34); });
}
function arp(t) {
  const scale=[330,392,440,523.25,659.25,784];
  const fq=scale[(step*2+Math.floor(step/2)) % scale.length];
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  o.type='triangle'; o.frequency.value=fq; f.type='lowpass'; f.frequency.value=2200;
  g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.28,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+.2);
}
function trigger(lane, t=audioCtx.currentTime) {
  const fns={ kick, snare, clap, hat, openHat, bass, synth, arp };
  (fns[lane.type] || kick)(t);
  if (midiOut) sendMidi(lane.midi, lane.type.includes('hat')?85:104, t);
}
function sendMidi(note, velocity, t) {
  try { midiOut.send([0x90, note, velocity]); setTimeout(()=>midiOut && midiOut.send([0x80, note, 0]), 90); } catch(e){}
}

function render() {
  grid.innerHTML='';
  lanes.forEach((lane,li)=>{
    const row=document.createElement('div'); row.className='row';
    const label=document.createElement('button'); label.className='lane'; label.textContent=lane.name;
    label.onclick=()=>{ initAudio(); audioCtx.resume(); trigger(lane); };
    row.appendChild(label);
    for(let s=0;s<STEPS;s++){
      const cell=document.createElement('button'); cell.className='cell'+(pattern[li][s]?' on':''); cell.dataset.step=s; cell.dataset.lane=li;
      cell.onclick=()=>{ initAudio(); audioCtx.resume(); pattern[li][s]=!pattern[li][s]; cell.classList.toggle('on',pattern[li][s]); if(pattern[li][s]) trigger(lane); };
      row.appendChild(cell);
    }
    grid.appendChild(row);
  });
}
function highlight(s) {
  document.querySelectorAll('.cell.active').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll(`.cell[data-step="${s}"]`).forEach(c=>c.classList.add('active'));
}

function scheduler() {
  const stepDur = 60/bpm/4;
  while (nextTime < audioCtx.currentTime + 0.14) {
    const s = step;
    const t = nextTime + (s % 2 ? swing * stepDur * 0.55 : 0);
    lanes.forEach((lane,li)=>{ if(pattern[li][s]) trigger(lane,t); });
    setTimeout(()=>highlight(s), Math.max(0,(t-audioCtx.currentTime)*1000));
    step=(step+1)%STEPS; nextTime+=stepDur;
  }
}
function play() {
  initAudio(); audioCtx.resume(); if(playing) return;
  playing=true; playBtn.textContent='■ Stop'; step=0; nextTime=audioCtx.currentTime+.06;
  timer=setInterval(scheduler,25);
}
function stop() { playing=false; playBtn.textContent='▶ Play'; clearInterval(timer); document.querySelectorAll('.cell.active').forEach(c=>c.classList.remove('active')); }
function randomize() { pattern = lanes.map(l=>Array.from({length:STEPS},()=>Math.random()<l.prob)); render(); }
function clearAll() { pattern = lanes.map(()=>Array(STEPS).fill(false)); render(); }
function loadPreset() {
  const map={kick:[0,4,8,12,14], snare:[4,12], clap:[4,12], hat:[0,2,4,6,8,10,12,14], open:[14], bass:[0,3,6,10,12], synth:[0,8], arp:[0,2,4,6,8,10,12,14]};
  pattern = lanes.map(l=>Array.from({length:STEPS},(_,i)=>(map[l.id]||[]).includes(i))); render();
}

document.getElementById('bpm').oninput=e=>{ bpm=+e.target.value; document.getElementById('bpmVal').textContent=bpm; };
document.getElementById('swing').oninput=e=>{ swing=+e.target.value/100; document.getElementById('swingVal').textContent=e.target.value+'%'; };
playBtn.onclick=()=> playing ? stop() : play();
document.getElementById('random').onclick=randomize;
document.getElementById('clear').onclick=clearAll;
document.getElementById('preset').onclick=loadPreset;
document.getElementById('midi').onclick=async()=>{
  try {
    if(!navigator.requestMIDIAccess) throw new Error('No MIDI');
    const access=await navigator.requestMIDIAccess({sysex:false});
    midiOut=[...access.outputs.values()][0];
    if(!midiOut) throw new Error('No output');
    document.getElementById('midi').textContent='MIDI: '+midiOut.name;
  } catch(e){ document.getElementById('midi').textContent='MIDI unavailable'; }
};
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); playing?stop():play(); } });

loadPreset();
</script>
</body>
</html>
