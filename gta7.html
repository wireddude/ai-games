<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>GTA 7 — 8-Bit Demake</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#fff;font:12px monospace;touch-action:none}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,150vh);height:min(100vh,66.67vw);background:#17252b;border:4px solid #313b42;box-shadow:0 0 40px #000}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}#title{position:absolute;inset:0;background:#101820dd;display:grid;place-items:center;text-align:center;padding:20px;z-index:2}#title h1{font-size:clamp(21px,5vw,42px);color:#f3df59;text-shadow:3px 3px #b32d3b;margin:8px}#title p{line-height:1.7}.btn{background:#b32d3b;color:white;border:2px solid #f3df59;padding:12px 24px;font:bold 15px monospace;border-radius:3px;touch-action:manipulation}#mute{position:absolute;right:8px;top:8px;z-index:3;background:#111c;color:#f3df59;border:1px solid #fff;padding:6px;font:12px monospace}#touch{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}.ctl{position:absolute;pointer-events:auto;background:#101a;border:2px solid #ffffff70;color:white;border-radius:12px;font:bold 11px monospace;touch-action:none;user-select:none}.pad{left:12px;bottom:14px;width:132px;height:132px}.pad button{position:absolute;width:42px;height:42px}.up{top:0;left:45px}.down{bottom:0;left:45px}.left{left:0;top:45px}.right{right:0;top:45px}.actions{position:absolute;right:12px;bottom:14px;display:grid;grid-template-columns:60px 72px;gap:8px;align-items:end}.actions button{height:58px}.actions .wide{grid-column:span 2;height:42px}@media(pointer:coarse){#touch{display:block}}@media(max-height:430px){.pad{width:108px;height:108px}.pad button{width:36px;height:36px}.up{left:36px}.down{left:36px}.left{top:36px}.right{top:36px}.actions{grid-template-columns:50px 60px}.actions button{height:48px}}
</style></head><body><main id="wrap"><canvas id="c" width="480" height="320"></canvas><button id="mute">♫ ON</button><section id="title"><div><h1>GTA VII<br>8-BIT DEMake</h1><p>WELCOME TO NEW ROME<br>STEAL CARS • MAKE TROUBLE • LOSE THE COPS<br><small>WASD / ARROWS move & drive · E enter/exit · F or click shoot · SPACE brake · M mute</small></p><button class="btn" id="start">PRESS START</button></div></section></main><div id="touch"><div class="pad"><button class="ctl up" data-key="w">▲</button><button class="ctl down" data-key="s">▼</button><button class="ctl left" data-key="a">◀</button><button class="ctl right" data-key="d">▶</button></div><div class="actions"><button class="ctl" data-key="space">BRAKE</button><button class="ctl" data-act="shoot">SHOOT</button><button class="ctl wide" data-act="steal">STEAL / EXIT</button></div></div><script>
'use strict';const c=document.querySelector('#c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const W=2400,H=1800,keys={},roads=[180,500,820,1140,1460,1780,2100],types=[['SPORTS',3.2,'#eb4145'],['SEDAN',2.4,'#7b9ca8'],['TAXI',2.5,'#f4ca37'],['MUSCLE',2.9,'#823bca'],['POLICE',2.7,'#e8e8df']];let started=false,muted=false,ac=null,player={x:500,y:500,a:0,hp:100,armor:30,cash:0,score:0,car:null},cam={x:0,y:0},cars=[],peds=[],bullets=[],fx=[],wanted=0,heat=0,garage={x:2020,y:1450},time=0,shootcd=0;
function audio(f=220,d=.08,w='square'){if(muted)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function crime(n=1){wanted=Math.min(5,wanted+n);heat=14+4*wanted}
function road(x0,y0){return roads.some(r=>Math.abs(x0-r)<72)||roads.some(r=>Math.abs(y0-r)<72)}
function buildingRects(){let out=[];for(let i=0;i<roads.length-1;i++)for(let j=0;j<roads.length-1;j++){let bx=roads[i]+80,by=roads[j]+80,bw=roads[i+1]-roads[i]-160,bh=roads[j+1]-roads[j]-160;out.push({x:bx,y:by,w:bw,h:bh,park:(i+j)%5===1})}return out}const blocks=buildingRects();
function carMake(x0,y0,type,ai=true){let t=types[type];return{x:x0,y:y0,a:Math.random()<.5?0:Math.PI/2,type,name:t[0],color:t[2],speed:0,max:t[1],hp:100,ai,dir:Math.random()<.5?1:-1}}
for(let i=0;i<24;i++){let r=roads[1+Math.floor(Math.random()*5)],v=roads[1+Math.floor(Math.random()*5)];cars.push(carMake(Math.random()<.5?r+(Math.random()-.5)*30:Math.random()*W,Math.random()<.5?v+(Math.random()-.5)*30:Math.random()*H,Math.floor(Math.random()*4)))}
for(let i=0;i<36;i++)peds.push({x:roads[1]+Math.random()*1200,y:roads[1]+Math.random()*1100,a:Math.random()*6.28,hp:1,alive:true,shirt:['#eab07b','#de4d77','#61b7a8','#e8e4d7'][i%4]});
function nearRoad(px,py){return road(px,py)}function hitBuilding(px,py){return blocks.some(b=>px>b.x&&px<b.x+b.w&&py>b.y&&py<b.y+b.h&&!b.park)}function shoot(){if(shootcd>0)return;shootcd=.23;let px=player.car?player.car.x:player.x,py=player.car?player.car.y:player.y,a=player.car?player.car.a:player.a;bullets.push({x:px+Math.cos(a)*15,y:py+Math.sin(a)*15,vx:Math.cos(a)*410,vy:Math.sin(a)*410,t:1});audio(160,.07);crime()}
function steal(){if(player.car){player.x=player.car.x+20;player.y=player.car.y;player.car.ai=false;player.car=null;return}let car=cars.filter(q=>Math.hypot(q.x-player.x,q.y-player.y)<35).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(car){player.car=car;car.ai=false;car.speed=0;player.a=car.a;crime();audio(400,.08)}}
function pressed(k){keys[k]=true;if(k==='f'||k==='enter')shoot();if(k==='e')steal();if(k==='m')toggleMute()}function keydown(e){let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!keys[k])pressed(k)}addEventListener('keydown',keydown);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointerdown',()=>shoot());
function toggleMute(){muted=!muted;document.querySelector('#mute').textContent=muted?'♫ OFF':'♫ ON';if(!muted)audio(500)}document.querySelector('#mute').onclick=toggleMute;document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#title').style.display='none';audio(440)};
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.querySelector('[data-act=shoot]').onpointerdown=e=>{e.preventDefault();shoot()};document.querySelector('[data-act=steal]').onpointerdown=e=>{e.preventDefault();steal()};
function update(dt){if(!started)return;time+=dt;shootcd=Math.max(0,shootcd-dt);let p=player,car=p.car, turn=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),move=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);if(car){car.a+=turn*dt*(keys.space?2.3:2.7)*(Math.abs(car.speed)/car.max+.25);car.speed+=move*car.max*2.2*dt;if(keys.space)car.speed*=Math.pow(.04,dt);car.speed=Math.max(-car.max*.45,Math.min(car.max,car.speed));let nx=car.x+Math.cos(car.a)*car.speed*65*dt,ny=car.y+Math.sin(car.a)*car.speed*65*dt;if(!hitBuilding(nx,ny)){car.x=nx;car.y=ny}else{car.speed*=-.25;car.hp-=4;audio(80,.12)}p.x=car.x;p.y=car.y;if(Math.abs(car.speed)>1.2){peds.forEach(q=>{if(q.alive&&Math.hypot(q.x-p.x,q.y-p.y)<20){q.alive=false;p.cash+=25;p.score+=100;crime();fx.push({x:q.x,y:q.y,t:.5,color:'#ee4560'});audio(90,.14)}})}}else{if(turn||move){if(turn)p.a=Math.atan2((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),turn);if(move)p.a=Math.atan2(-move,turn||Math.cos(p.a));let sp=keys.shift?180:125,nx=p.x+Math.cos(p.a)*sp*dt,ny=p.y+Math.sin(p.a)*sp*dt;if(!hitBuilding(nx,ny)){p.x=nx;p.y=ny}}}
 cars.forEach(q=>{if(q===car)return;if(q.ai){if(Math.abs(q.speed)<.4)q.speed=q.max*.36;q.x+=Math.cos(q.a)*q.speed*25*dt*q.dir;q.y+=Math.sin(q.a)*q.speed*25*dt*q.dir;if(q.x<40||q.x>W-40||q.y<40||q.y>H-40)q.dir*=-1} });peds.forEach(q=>{if(!q.alive)return;q.x+=Math.cos(q.a)*18*dt;q.y+=Math.sin(q.a)*18*dt;if(Math.random()<dt*.25)q.a+=(Math.random()-.5)*2;if(hitBuilding(q.x,q.y)){q.a+=Math.PI}});
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;peds.forEach(q=>{if(q.alive&&Math.hypot(q.x-b.x,q.y-b.y)<12){q.alive=false;b.t=0;crime();p.cash+=10;audio(110,.1)}});cars.forEach(q=>{if(Math.hypot(q.x-b.x,q.y-b.y)<18){q.hp-=25;b.t=0;if(q.hp<=0){fx.push({x:q.x,y:q.y,t:1,color:'#ff791f'});q.hp=100;q.ai=false;crime(2);audio(55,.3)}}})});bullets=bullets.filter(b=>b.t>0);fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
 if(wanted){heat-=dt;if(heat<=0){wanted=Math.max(0,wanted-1);heat=wanted?12:0}}if(wanted&&Math.random()<dt*wanted*.12&&!cars.some(q=>q.police)){let q=carMake(p.x+300,p.y+200,4);q.police=true;q.ai=false;cars.push(q)}cars.filter(q=>q.police).forEach(q=>{let a=Math.atan2(p.y-q.y,p.x-q.x);q.a=a;q.x+=Math.cos(a)*45*dt;q.y+=Math.sin(a)*45*dt;if(Math.hypot(p.x-q.x,p.y-q.y)<24){p.hp-=dt*8;if(p.armor>0)p.armor=Math.max(0,p.armor-dt*8)}});
 if(p.x>garage.x-45&&p.x<garage.x+45&&p.y>garage.y-35&&p.y<garage.y+35&&p.car&&wanted){wanted=0;heat=0;p.car.color='#48c8ac';audio(650,.25)}p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(20,Math.min(H-20,p.y));cam.x=Math.max(0,Math.min(W-480,p.x-240));cam.y=Math.max(0,Math.min(H-320,p.y-160));}
function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(Math.round(a),Math.round(b),w,h)}function draw(){x.fillStyle='#315b3c';x.fillRect(0,0,480,320);x.save();x.translate(-Math.floor(cam.x),-Math.floor(cam.y));blocks.forEach((b,i)=>{rect(b.x,b.y,b.w,b.h,b.park?'#347443':'#b8a77d');if(b.park){for(let k=0;k<7;k++){rect(b.x+20+(k*53)%Math.max(60,b.w-25),b.y+25+(k*37)%Math.max(50,b.h-30),13,13,'#24603a');rect(b.x+23+(k*53)%Math.max(60,b.w-25),b.y+28+(k*37)%Math.max(50,b.h-30),6,6,'#51a34c')}}else{rect(b.x+8,b.y+8,b.w-16,b.h-16,['#7c7189','#bd654c','#5c7f91'][i%3]);for(let wx=b.x+18;wx<b.x+b.w-12;wx+=30)for(let wy=b.y+17;wy<b.y+b.h-10;wy+=28)rect(wx,wy,9,8,'#e8d17a');rect(b.x+b.w*.45,b.y+b.h-18,24,18,'#3c3437')}});
 roads.forEach(r=>{rect(r-70,0,140,H,'#454950');rect(0,r-70,W,140,'#454950');rect(r-3,0,5,H,'#ded3a0');rect(0,r-3,W,5,'#ded3a0');for(let q=0;q<H;q+=48)rect(r-1,q,2,22,'#a8a48e');for(let q=0;q<W;q+=48)rect(q,r-1,22,2,'#a8a48e')});
 rect(garage.x-38,garage.y-24,76,48,'#d04b42');rect(garage.x-27,garage.y-12,54,28,'#30353c');x.fillStyle='white';x.font='8px monospace';x.fillText("PAY 'N' SPRAY",garage.x-36,garage.y-28);
 peds.forEach(q=>{if(!q.alive)return;rect(q.x-4,q.y-3,8,9,q.shirt);rect(q.x-3,q.y-8,6,6,'#e7b88d');rect(q.x-4,q.y+5,3,5,'#28313b');rect(q.x+1,q.y+5,3,5,'#28313b')});cars.forEach(q=>{rect(q.x-12,q.y-7,24,14,'#15191e');rect(q.x-10,q.y-6,20,12,q.police?(Math.floor(time*8)%2?'#e33':'#349cff'):q.color);rect(q.x-3,q.y-4,7,8,'#a6c2c5');if(q.hp<40)rect(q.x-4,q.y-13,8,4,'#555')});bullets.forEach(b=>rect(b.x-2,b.y-2,4,4,'#fff47d'));fx.forEach(f=>{for(let z=0;z<5;z++)rect(f.x+(Math.random()-.5)*30,f.y+(Math.random()-.5)*30,4,4,f.color)});
 if(!player.car){rect(player.x-5,player.y-6,10,13,'#e9d546');rect(player.x-3,player.y-10,6,6,'#e9b68f');rect(player.x+Math.cos(player.a)*7-2,player.y+Math.sin(player.a)*7-2,4,4,'#222')}x.restore();hud()}
function hud(){rect(0,0,480,38,'#10151deF');x.fillStyle='#fff';x.font='10px monospace';x.fillText('CASH $'+player.cash+'  SCORE '+player.score,8,13);x.fillText('HEALTH',8,29);rect(55,21,80,8,'#612b32');rect(55,21,80*player.hp/100,8,'#e8484f');x.fillText('ARMOR '+Math.floor(player.armor),145,28);x.fillText('WEAPON: 9MM ∞',225,13);x.fillStyle='#f1d749';x.fillText('★'.repeat(wanted)+'☆'.repeat(5-wanted),365,14);x.fillStyle='#bce8ca';x.fillText(player.car?player.car.name:'NEW ROME / ON FOOT',225,29);let mx=426,my=53;rect(mx-26,my-18,52,36,'#141a20');roads.forEach(r=>{rect(mx-26+r/W*52,my-18,2,36,'#bbb');rect(mx-26,my-18+r/H*36,52,2,'#bbb')});cars.forEach(q=>{let xx=mx-26+q.x/W*52,yy=my-18+q.y/H*36;rect(xx,yy,2,2,q.police?'#f33':'#fff')});rect(mx-26+player.x/W*52-1,my-18+player.y/H*36-1,4,4,'#ffdc38');if(player.hp<=0){rect(80,115,320,80,'#10151dee');x.fillStyle='#f44';x.font='24px monospace';x.fillText('WASTED',180,155);x.font='10px monospace';x.fillStyle='white';x.fillText('Refresh to try again',179,177)}}let prev=0;function loop(t){let dt=Math.min(.05,(t-prev)/1000||0);prev=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
