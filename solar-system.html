<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Solar System Explorer — Learn the Planets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #scene { width: 100%; height: 100%; display: block; }

  /* ---- HUD ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: #fff; pointer-events: none; z-index: 10;
  }
  #hud > * { pointer-events: auto; }
  #title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #title span { color: #ffd54a; }
  #controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfd8dc; }
  .ctl label { white-space: nowrap; }
  input[type=range] { width: 150px; accent-color: #ffd54a; cursor: pointer; }
  #speedVal { min-width: 52px; text-align: center; font-weight: 600; color: #ffd54a; }
  button {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: rgba(255,255,255,0.25); }
  #resetBtn { background: rgba(255,77,77,0.25); border-color: rgba(255,77,77,0.5); }
  #resetBtn:hover { background: rgba(255,77,77,0.45); }
  #soundBtn { background: rgba(77,255,180,0.2); border-color: rgba(77,255,180,0.4); }
  #soundBtn:hover { background: rgba(77,255,180,0.35); }
  #soundBtn.muted { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #888; }
  @media (pointer: coarse) {
    button { padding: 12px 20px; font-size: 15px; }
    input[type=range] { width: 180px; }
    .ctl label { font-size: 15px; }
    #title { font-size: 22px; }
  }

  /* ---- Tooltip ---- */
  #tooltip {
    position: absolute; display: none; pointer-events: none; z-index: 20;
    background: rgba(10,14,20,0.92); color: #fff; border: 1px solid rgba(255,213,74,0.5);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.5;
    max-width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  #tooltip h3 { color: #ffd54a; font-size: 15px; margin-bottom: 4px; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .row b { color: #90a4ae; font-weight: 500; }

  /* ---- Help ---- */
  #help {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #b0bec5; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 8px 16px; font-size: 12px; text-align: center;
    pointer-events: none; z-index: 10; white-space: nowrap;
  }
  #help b { color: #fff; }
  @media (max-width: 700px){ #help { display:none; } }
</style>
</head>
<body>
<canvas id="scene" tabindex="0"></canvas>

<div id="hud">
  <div id="title">🪐 Solar System <span>Explorer</span></div>
  <div id="controls">
    <div class="ctl">
      <label>⏩ Speed</label>
      <input type="range" id="speed" min="0" max="100" value="20">
      <span id="speedVal">1×</span>
    </div>
    <button id="resetBtn" title="Reset camera & time">↺ Reset</button>
    <button id="soundBtn" title="Toggle space ambience">🔊 Sound</button>
  </div>
</div>

<div id="tooltip"></div>
<div id="help">
  <b>Drag</b> to orbit · <b>Scroll</b> to zoom · <b>WASD / Arrows</b> move · <b>Q/E</b> up/down · <b>+ / −</b> zoom · <b>R</b> reset
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   SOLAR SYSTEM EXPLORER
   Real physics: actual orbital periods (days) & relative sizes.
   Distances are compressed (power-law) so outer planets are visible.
   ============================================================ */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 45, 95);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 400;

/* ---------- Lighting ---------- */
const sunLight = new THREE.PointLight(0xffffff, 2.2, 0, 0);
sunLight.position.set(0,0,0);
scene.add(sunLight);
const ambient = new THREE.AmbientLight(0x334455, 0.35);
scene.add(ambient);

/* ---------- Stars ---------- */
(function makeStars(){
  const geo = new THREE.BufferGeometry();
  const n = 4000, pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 400 + Math.random()*600;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.7, sizeAttenuation:true });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------- Data (real values) ---------- */
// period in days, distance in AU, radius relative to Earth
const PLANETS = [
  { name:'Mercury', color:0x9c9c9c, period:87.97,  dist:0.39,  radius:0.38,  info:'Smallest planet, closest to the Sun. A year here is just 88 days!' },
  { name:'Venus',   color:0xe8c07a, period:224.7,  dist:0.72,  radius:0.95,  info:'Hottest planet — thick CO₂ atmosphere traps heat. Spins backwards!' },
  { name:'Earth',   color:0x4a90d9, period:365.25, dist:1.0,   radius:1.0,   info:'Our home. The only known place with life. Has 1 moon.' },
  { name:'Mars',    color:0xd96a4a, period:686.98, dist:1.52,  radius:0.53,  info:'The Red Planet — iron oxide dust. Home to the tallest volcano, Olympus Mons.' },
  { name:'Jupiter', color:0xd8b48a, period:4332.6, dist:5.2,   radius:11.2,  info:'Biggest planet — more than 2× all others combined. Great Red Spot storm.' },
  { name:'Saturn',  color:0xe6d9a8, period:10759,  dist:9.58,  radius:9.45,  info:'Famous for its beautiful rings of ice and rock. Least dense planet.' },
  { name:'Uranus',  color:0x9ad6e0, period:30688,  dist:19.2,  radius:4.0,   info:'An ice giant that rolls on its side — tipped over 98°!' },
  { name:'Neptune', color:0x4a6ad9, period:60182,  dist:30.05, radius:3.88,  info:'Farthest planet. Supersonic winds over 2,000 km/h. Deep blue.' },
];

// Compress distances & sizes so everything is visible (power-law scaling)
const DIST_SCALE = 10, DIST_POW = 0.6;
const SIZE_SCALE = 0.5, SIZE_POW = 0.5;
const distOf = au => DIST_SCALE * Math.pow(au, DIST_POW);
const sizeOf = rel => SIZE_SCALE * Math.pow(rel, SIZE_POW);

/* ---------- Sun ---------- */
const sunGeo = new THREE.SphereGeometry(sizeOf(109), 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color:0xffd54a });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);
// glow sprite
const glowTex = (function(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'rgba(255,213,74,0.9)');
  grad.addColorStop(0.4,'rgba(255,160,40,0.35)');
  grad.addColorStop(1,'rgba(255,120,20,0)');
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, blending:THREE.AdditiveBlending, depthWrite:false }));
glow.scale.set(30,30,1);
scene.add(glow);

/* ---------- Build planets ---------- */
const bodies = [];   // { mesh, period, angle, dist, name, info, color, isMoon }
const orbitLines = [];

function makePlanet(p){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(sizeOf(p.radius), 32, 32),
    new THREE.MeshStandardMaterial({ color:p.color, roughness:0.9, metalness:0.1 })
  );
  const d = distOf(p.dist);
  const angle = Math.random()*Math.PI*2;
  mesh.position.set(Math.cos(angle)*d, 0, Math.sin(angle)*d);
  scene.add(mesh);
  bodies.push({ mesh, period:p.period, angle, dist:d, name:p.name, info:p.info, color:p.color, isMoon:false });

  // orbit line
  const pts = [];
  for(let i=0;i<=128;i++){ const a=i/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*d,0,Math.sin(a)*d)); }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.12 })
  );
  scene.add(line); orbitLines.push(line);

  // Saturn rings
  if(p.name==='Saturn'){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(sizeOf(p.radius)*1.3, sizeOf(p.radius)*2.2, 64),
      new THREE.MeshBasicMaterial({ color:0xd8c9a0, side:THREE.DoubleSide, transparent:true, opacity:0.7 })
    );
    ring.rotation.x = Math.PI/2.4;
    mesh.add(ring);
  }
}

PLANETS.forEach(makePlanet);

/* ---------- Earth's Moon ---------- */
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sizeOf(0.27), 24, 24),
  new THREE.MeshStandardMaterial({ color:0xbbbbbb, roughness:1 })
);
const earth = bodies.find(b=>b.name==='Earth');
const MOON_DIST = sizeOf(1.0)*2.6;   // orbit radius around Earth
const moon = { mesh:moonMesh, period:27.3, angle:Math.random()*Math.PI*2, dist:MOON_DIST, name:'Moon', info:'Earth\'s only natural satellite. It causes our ocean tides and stabilizes Earth\'s tilt.', color:0xbbbbbb, isMoon:true };
earth.mesh.add(moonMesh);
bodies.push(moon);

/* ---------- Time ---------- */
let simDays = 0;          // simulated days elapsed
let speed = 1;            // days per real second
const BASE_SPEED = 0.5;   // multiplier so slider feels good

const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', ()=>{
  // exponential mapping: 0..100 -> 0..60 days/sec
  const v = speedSlider.value/100;
  speed = Math.pow(60, v);
  speedVal.textContent = (speed<1 ? speed.toFixed(2) : Math.round(speed)) + '×';
});
speedSlider.dispatchEvent(new Event('input'));

/* ---------- Keyboard ---------- */
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key==='r'||e.key==='R') resetView();
  if(e.key==='+'||e.key==='=') camera.position.multiplyScalar(0.9);
  if(e.key==='-'||e.key==='_') camera.position.multiplyScalar(1.1);
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

function moveCamera(dt){
  const s = 30*dt;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
  const dir = new THREE.Vector3();
  if(keys['w']||keys['arrowup'])    dir.add(fwd);
  if(keys['s']||keys['arrowdown'])  dir.sub(fwd);
  if(keys['a']||keys['arrowleft'])  dir.sub(right);
  if(keys['d']||keys['arrowright']) dir.add(right);
  if(keys['q']) dir.y += 1;
  if(keys['e']) dir.y -= 1;
  if(dir.lengthSq()>0){ dir.normalize().multiplyScalar(s); camera.position.add(dir); }
}

/* ---------- Reset ---------- */
function resetView(){
  camera.position.set(0,45,95);
  controls.target.set(0,0,0);
  controls.update();
  simDays = 0;
  speedSlider.value = 20; speedSlider.dispatchEvent(new Event('input'));
}
document.getElementById('resetBtn').addEventListener('click', resetView);
document.getElementById('soundBtn').addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  toggleSound();
});

/* ---------- Audio (Space Soundscape) ---------- */
let audioCtx = null;
let masterGain = null;
let soundEnabled = false;
let noiseSource = null;
let noiseGain = null;
let humOsc = null;
let humGain = null;
let lfoOsc = null;
let lfoGain = null;
let filter = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.15;
  masterGain.connect(audioCtx.destination);

  filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 120;
  filter.Q.value = 2;
  filter.connect(masterGain);

  // Low hum
  humOsc = audioCtx.createOscillator();
  humOsc.type = 'sine';
  humOsc.frequency.value = 32;
  humGain = audioCtx.createGain();
  humGain.gain.value = 0.02;
  humOsc.connect(humGain);
  humGain.connect(filter);
  humOsc.start();

  // LFO for subtle modulation
  lfoOsc = audioCtx.createOscillator();
  lfoOsc.type = 'sine';
  lfoOsc.frequency.value = 0.05;
  lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 8;
  lfoOsc.connect(lfoGain);
  lfoGain.connect(humOsc.frequency);
  lfoOsc.start();

  // Filtered noise for "space wind"
  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;
  noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.008;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 400;
  noiseFilter.Q.value = 0.5;
  noiseSource.connect(noiseGain);
  noiseGain.connect(noiseFilter);
  noiseFilter.connect(masterGain);
  noiseSource.start();

  // Occasional "cosmic ray" pings
  schedulePings();
}

function schedulePings() {
  if (!audioCtx || !soundEnabled) return;
  const delay = 3 + Math.random() * 12;
  setTimeout(() => {
    if (!soundEnabled) return;
    playPing();
    schedulePings();
  }, delay * 1000);
}

function playPing() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const pingFilter = audioCtx.createBiquadFilter();
  pingFilter.type = 'bandpass';
  pingFilter.frequency.value = 800 + Math.random() * 1200;
  pingFilter.Q.value = 10;
  osc.type = 'sine';
  osc.frequency.value = pingFilter.frequency.value;
  osc.connect(gain);
  gain.connect(pingFilter);
  pingFilter.connect(masterGain);
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.03, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
  osc.start(now);
  osc.stop(now + 3);
}

function toggleSound() {
  if (!audioCtx) {
    initAudio();
    soundEnabled = true;
  } else if (soundEnabled) {
    masterGain.gain.value = 0;
    soundEnabled = false;
  } else {
    masterGain.gain.value = 0.15;
    soundEnabled = true;
    schedulePings();
  }
  updateSoundButton();
}

function updateSoundButton() {
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Sound';
  btn.classList.toggle('muted', !soundEnabled);
}

/* ---------- Tooltip (mouseover labels) ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null;
let tapTooltipTimeout = null;

function onMove(e){
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', e=>{ if(e.touches[0]) onMove(e.touches[0]); }, {passive:true});

function showTapTooltip(target) {
  if (tapTooltipTimeout) clearTimeout(tapTooltipTimeout);
  const periodDays = target.period;
  const years = (periodDays/365.25).toFixed(2);
  tooltip.innerHTML =
    `<h3>${target.name}</h3>` +
    `<div class="row"><span><b>Orbit period</b></span><span>${periodDays.toFixed(1)} days (${years} yr)</span></div>` +
    (target.isMoon ? '' : `<div class="row"><span><b>Distance from Sun</b></span><span>${(target.dist/DIST_SCALE).toFixed(2)} AU</span></div>`) +
    `<div style="margin-top:6px;color:#cfd8dc">${target.info}</div>`;
  tooltip.style.display='block';
  tooltip.style.left = (mouse.x*0.5+0.5)*window.innerWidth + 16 + 'px';
  tooltip.style.top  = (-mouse.y*0.5+0.5)*window.innerHeight - 20 + 'px';
  tapTooltipTimeout = setTimeout(() => {
    if (hovered !== target) tooltip.style.display='none';
  }, 3000);
}

function onTap(e) {
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  if (!clientX || !clientY) return;
  mouse.x = (clientX/window.innerWidth)*2-1;
  mouse.y = -(clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = bodies.map(b=>b.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length) {
    let obj = hits[0].object;
    while(obj && !bodies.find(b=>b.mesh===obj)) obj = obj.parent;
    const target = bodies.find(b=>b.mesh===obj);
    if (target) {
      showTapTooltip(target);
      hovered = target;
    }
  }
}
window.addEventListener('click', onTap);
window.addEventListener('touchend', (e) => {
  if (e.changedTouches[0] && Date.now() - (e.timeStamp || Date.now()) < 500) {
    onTap(e.changedTouches[0]);
  }
}, {passive:true});

function updateTooltip(){
  if (window.matchMedia('(pointer: coarse)').matches) return;
  raycaster.setFromCamera(mouse, camera);
  const meshes = bodies.map(b=>b.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  let target = null;
  if(hits.length){
    let obj = hits[0].object;
    while(obj && !bodies.find(b=>b.mesh===obj)) obj = obj.parent;
    target = bodies.find(b=>b.mesh===obj);
  }
  if(target !== hovered){
    hovered = target;
    if(target){
      const periodDays = target.period;
      const years = (periodDays/365.25).toFixed(2);
      tooltip.innerHTML =
        `<h3>${target.name}</h3>` +
        `<div class="row"><span><b>Orbit period</b></span><span>${periodDays.toFixed(1)} days (${years} yr)</span></div>` +
        (target.isMoon ? '' : `<div class="row"><span><b>Distance from Sun</b></span><span>${(target.dist/DIST_SCALE).toFixed(2)} AU</span></div>`) +
        `<div style="margin-top:6px;color:#cfd8dc">${target.info}</div>`;
      tooltip.style.display='block';
    } else {
      tooltip.style.display='none';
    }
  }
  if(hovered){
    tooltip.style.left = (mouse.x*0.5+0.5)*window.innerWidth + 16 + 'px';
    tooltip.style.top  = (-mouse.y*0.5+0.5)*window.innerHeight - 20 + 'px';
  }
}

/* ---------- Animation loop ---------- */
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now-last)/1000, 0.1); last = now;

  // advance simulation
  simDays += speed*BASE_SPEED*dt;
  for(const b of bodies){
    b.angle += (2*Math.PI/b.period) * (speed*BASE_SPEED*dt);
    if(b.isMoon){
      // moon orbits Earth (which is at earth.mesh position)
      b.mesh.position.set(Math.cos(b.angle)*b.dist, 0, Math.sin(b.angle)*b.dist);
    } else {
      b.mesh.position.set(Math.cos(b.angle)*b.dist, 0, Math.sin(b.angle)*b.dist);
    }
  }
  // slow self-rotation
  sun.rotation.y += dt*0.05;
  for(const b of bodies) if(!b.isMoon) b.mesh.rotation.y += dt*0.1;

  moveCamera(dt);
  controls.update();
  updateTooltip();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---------- Resume audio on first interaction (iOS) ---------- */
function resumeAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  window.removeEventListener('touchstart', resumeAudio);
  window.removeEventListener('click', resumeAudio);
  window.removeEventListener('keydown', resumeAudio);
}
window.addEventListener('touchstart', resumeAudio, {once: true});
window.addEventListener('click', resumeAudio, {once: true});
window.addEventListener('keydown', resumeAudio, {once: true});

/* ---------- Resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
