<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>Solar System — 3D Flyby</title>
<style>
:root{
  --accent:#7fd4ff; --text:#dfe7f5; --dim:#8fa0b8;
  --glass:rgba(9,13,22,.74); --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020409;color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#brand{position:absolute;top:14px;left:14px;padding:11px 16px;pointer-events:auto}
#brand h1{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
#brand p{font-size:11.5px;color:var(--dim);margin-top:4px;max-width:260px}
#nav{position:absolute;top:104px;left:14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#nav button{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--glass);color:var(--text);
  font-size:13px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .15s,border-color .15s,transform .1s}
#nav button:hover{background:rgba(30,40,60,.85);transform:translateX(2px)}
#nav button.active{border-color:var(--accent);color:#fff;background:rgba(35,55,85,.8)}
#nav .dot{width:11px;height:11px;border-radius:50%;flex:none}
#panel{position:absolute;top:14px;right:14px;width:282px;padding:16px;display:none;pointer-events:auto}
#panel h2{font-size:20px;letter-spacing:.03em}
#panel .ptype{font-size:11.5px;color:var(--accent);margin:2px 0 10px;text-transform:uppercase;letter-spacing:.08em}
#panel .rows{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin-bottom:10px}
#panel .rows span{color:var(--dim)}
#panel .rows b{text-align:right;font-weight:500}
#panel .fact{font-size:12.5px;line-height:1.55;color:var(--text);opacity:.9;border-left:2px solid var(--accent);padding-left:10px}
#panel .pbtns{display:flex;gap:8px;margin-top:12px}
#panel button{pointer-events:auto;flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.06);color:var(--text);font-size:12.5px;cursor:pointer}
#panel button:hover{background:rgba(255,255,255,.14)}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;justify-content:center;max-width:94vw;pointer-events:auto}
#controls button{padding:6px 12px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.06);color:var(--text);font-size:13px;cursor:pointer}
#controls button:hover{background:rgba(255,255,255,.14)}
#controls button.on{border-color:var(--accent);color:#fff;background:rgba(35,55,85,.8)}
.ck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.ck input{accent-color:var(--accent);cursor:pointer}
.speedo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.speedo input{width:130px;accent-color:var(--accent);cursor:pointer}
.speedo b{color:var(--text);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#status{position:absolute;bottom:70px;left:14px;padding:7px 12px;font-size:12px;color:var(--dim)}
#hint{position:absolute;bottom:16px;right:14px;font-size:11px;color:var(--dim);text-align:right;line-height:1.8}
#hint b{color:var(--text);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;letter-spacing:.1em;
  color:rgba(222,234,252,.88);text-shadow:0 0 6px rgba(0,0,0,.95);pointer-events:none;
  white-space:nowrap;text-transform:uppercase;transition:opacity .2s}
.lbl.moon{font-size:9.5px;color:rgba(185,200,228,.72)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
#tooltip{position:fixed;z-index:9;pointer-events:none;display:none;padding:4px 9px;
  font-size:12px;border-radius:8px;background:rgba(10,16,28,.9);border:1px solid var(--line)}
#fatal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;
  max-width:440px;padding:24px;text-align:center;line-height:1.6;font-size:13.5px}
@media (max-width:760px){ #hint{display:none} #panel{width:230px;top:auto;bottom:74px;right:10px} #brand p{display:none} }
</style>
</head>
<body>
<div id="ui">
  <div id="brand" class="glass">
    <h1>&#9728; Solar System</h1>
    <p>drag to orbit &middot; scroll / pinch to zoom &middot; click any planet for a 3D flyby</p>
  </div>
  <div id="nav"></div>
  <div id="panel" class="glass"></div>
  <div id="controls" class="glass">
    <button id="playpause" title="Space">&#10074;&#10074;</button>
    <label class="speedo"><span>speed</span>
      <input id="speed" type="range" min="-1" max="1.7" step="0.01" value="0"/>
      <b id="speedv">1&times;</b>
    </label>
    <label class="ck"><input type="checkbox" id="orbits" checked> orbits</label>
    <label class="ck"><input type="checkbox" id="labels" checked> labels</label>
    <label class="ck"><input type="checkbox" id="drift" checked> drift</label>
    <button id="tour">&#9654; tour</button>
  </div>
  <div id="status" class="glass"></div>
  <div id="hint">
    <b>keys</b><br/>
    1&ndash;8 planets &middot; 0 sun &middot; esc overview<br/>
    + / &minus; zoom &middot; space pause &middot; T tour<br/>
    O orbits &middot; L labels
  </div>
</div>
<div id="labels"></div>
<div id="tooltip"></div>
<div id="fatal" class="glass"></div>
<div id="boot" class="glass" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;padding:18px 28px;font-size:14px;text-align:center">Loading 3D engine&#8230;</div>

<script type="module">
(async function(){
'use strict';

/* ---- error surface: never fail silently into a black screen ---- */
function showFatal(msg){
  var f = document.getElementById('fatal');
  f.style.display = 'block';
  f.innerHTML = '<h2 style="margin-bottom:10px">&#9888; 3D not available</h2><p>' + msg + '</p>';
}
window.__fatal = showFatal;
window.addEventListener('error', function(e){
  if (e && e.message) showFatal('A script error stopped the simulation: ' + e.message);
});
window.addEventListener('unhandledrejection', function(e){
  if (e && e.reason) showFatal('The simulation could not start: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

/* ---- load the 3D engine as an ES module. ----
   The UMD build (three.min.js) is deprecated with r150+ and removed with r160,
   so we load the official module build instead. Tries several CDNs in order. */
var ENGINE_URLS = [
  'https://unpkg.com/three@0.152.2/build/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.module.min.js'
];
var THREE = null;
for (var i = 0; !THREE && i < ENGINE_URLS.length; i++){
  try { THREE = await import(ENGINE_URLS[i]); } catch (err) { THREE = null; }
}
var boot = document.getElementById('boot');
if (!THREE || !THREE.WebGLRenderer){
  if (boot) boot.style.display = 'none';
  showFatal('Could not load the 3D engine (Three.js r152) from any CDN. Check your internet connection and reload.');
  return;
}
window.THREE = THREE;
if (boot) boot.style.display = 'none';
window.__appStarted = true;

try { main(); }
catch (err) {
  showFatal('The simulation failed to start: ' + (err && err.message ? err.message : err) +
    (err && err.stack ? '<br><small style="color:#8fa0b8">' + err.stack.split('\n').slice(0, 5).join('<br>') + '</small>' : ''));
}

function main(){
var THREE = window.THREE;
var TWO_PI = Math.PI * 2, DEG = Math.PI / 180;
var YEAR_SEC = 30;   // Earth years per real second at 1x
var DAY_SEC  = 8;    // Earth days per real second (spin) at 1x

function showFatal(msg){ window.__fatal(msg); }

var renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
} catch (e) {
  showFatal('Your browser could not create a WebGL context. Try Chrome, Edge, Firefox or Safari with hardware acceleration enabled.');
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x02040a, 1);
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 9000);

// ---------- lighting ----------
var sunLight = new THREE.PointLight(0xfff2d8, 2.8, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x8899bb, 0.34));
if ('useLegacyLights' in renderer) renderer.useLegacyLights = true;

// ---------- small utils ----------
function mulberry(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry(20261001);
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function canvasTex(w, h, draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// surface painting helpers
function stripes(ctx, w, h, cols, wamp, seed){
  var r = mulberry(seed || 1), n = cols.length, bh = h / n;
  for (var i = 0; i < n; i++){
    var y0 = i * bh, ph = r() * 6.28;
    ctx.fillStyle = cols[i];
    ctx.beginPath();
    for (var x = 0; x <= w; x += 6){ var y = y0 + Math.sin(x * .045 + ph + i * 1.9) * wamp; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    for (var x2 = w; x2 >= 0; x2 -= 6){ var y2 = (y0 + bh * 1.3) + Math.sin(x2 * .045 + ph + i * 1.9) * wamp; ctx.lineTo(x2, y2); }
    ctx.closePath(); ctx.fill();
  }
}
function speckle(ctx, w, h, n, r, colors, rad, alpha){
  for (var i = 0; i < n; i++){
    var x = r() * w, y = r() * h, rr = .5 + r() * rad;
    ctx.fillStyle = colors[(r() * colors.length) | 0];
    ctx.globalAlpha = alpha;
    for (var o = -1; o <= 1; o++){ ctx.beginPath(); ctx.arc(x + o * w, y, rr, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function craters(ctx, w, h, n, r){
  for (var i = 0; i < n; i++){
    var rr = 1.5 + r() * r() * 9, x = rr + r() * (w - 2 * rr), y = h * .1 + r() * h * .8;
    ctx.globalAlpha = .28; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.283); ctx.fill();
    ctx.globalAlpha = .18; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - rr * .3, y - rr * .3, rr * .7, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function blotches(ctx, w, h, n, r, colors, scale){
  for (var i = 0; i < n; i++){
    var x = r() * w, y = r() * h;
    ctx.fillStyle = colors[(r() * colors.length) | 0];
    ctx.globalAlpha = .22;
    for (var b = 0; b < 8; b++){
      x += (r() - .5) * scale; y += (r() - .5) * scale;
      y = clamp(y, 4, h - 4);
      var rr = 2 + r() * 6;
      for (var o = -1; o <= 1; o++){ ctx.beginPath(); ctx.arc(x + o * w, y, rr, 0, 6.283); ctx.fill(); }
    }
  }
  ctx.globalAlpha = 1;
}
function caps(ctx, w, h, frac, c){
  ctx.fillStyle = c; ctx.globalAlpha = .95;
  ctx.fillRect(0, 0, w, h * frac);
  ctx.fillRect(0, h * (1 - frac), w, h * frac);
  ctx.globalAlpha = 1;
}

// ---------- surface textures ----------
var PAINTERS = {
  sun: function(ctx, w, h){
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#ffdf8a'); g.addColorStop(.5, '#ff9d3c'); g.addColorStop(1, '#ffdf8a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    var r = mulberry(11);
    speckle(ctx, w, h, 260, r, ['#ffd97a', '#ff8c2a', '#ffe9a8', '#ff7a1f'], 3, .3);
    for (var i = 0; i < 6; i++){ ctx.globalAlpha = .25; ctx.fillStyle = '#c25a12';
      ctx.beginPath(); ctx.arc(r() * w, r() * .8 * h + h * .1, 3 + r() * 7, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
  },
  mercury: function(ctx, w, h){
    ctx.fillStyle = '#8a7f75'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(7);
    speckle(ctx, w, h, 380, r, ['#6f655c', '#9c9186', '#7d7268'], 2.5, .4);
    craters(ctx, w, h, 130, r);
  },
  venus: function(ctx, w, h){
    ctx.fillStyle = '#d8b06a'; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#d8b06a', '#c9a058', '#e2bd78', '#c39a52', '#dbb56e', '#c9a25c'], 5, 21);
    blotches(ctx, w, h, 14, mulberry(22), ['#e8c98a', '#bf9850'], 30);
  },
  earth: function(ctx, w, h){
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#14508c'); g.addColorStop(.5, '#1e6fae'); g.addColorStop(1, '#14508c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    var r = mulberry(42);
    for (var c = 0; c < 9; c++){
      var x = r() * w, y = h * (.22 + r() * .56);
      for (var b = 0; b < 26; b++){
        x += (r() - .5) * 22; y += (r() - .5) * 13; y = clamp(y, h * .12, h * .88);
        ctx.fillStyle = r() < .68 ? '#3e7a3a' : '#8f8a4f';
        ctx.globalAlpha = .8;
        var rr = 3 + r() * 9;
        for (var o = -1; o <= 1; o++){ ctx.beginPath(); ctx.arc(x + o * w, y, rr, 0, 6.283); ctx.fill(); }
      }
    }
    ctx.globalAlpha = 1;
    caps(ctx, w, h, .07, '#eef5fb');
    for (var i = 0; i < 22; i++){
      ctx.globalAlpha = .22; ctx.fillStyle = '#fff';
      var cx = r() * w, cy = r() * h, cr = 4 + r() * 10;
      for (var o2 = -1; o2 <= 1; o2++){ ctx.beginPath();
        ctx.ellipse(cx + o2 * w, cy, cr * 2.2, cr * .5, r() * .8 - .4, 0, 6.283); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  },
  mars: function(ctx, w, h){
    ctx.fillStyle = '#b5502f'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(31);
    speckle(ctx, w, h, 300, r, ['#8f3a20', '#cf6a42', '#a04828'], 3, .4);
    blotches(ctx, w, h, 12, r, ['#7c3018', '#d98a5c'], 26);
    caps(ctx, w, h, .05, '#f0e8e0');
  },
  jupiter: function(ctx, w, h){
    ctx.fillStyle = '#c9a06a'; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#e3c9a0', '#b98a5a', '#d8b483', '#a06a42', '#e0c39a', '#bd9161', '#dcb988', '#9c6840'], 3, 55);
    var r = mulberry(56);
    ctx.globalAlpha = .85; ctx.fillStyle = '#b3402a';
    ctx.beginPath(); ctx.ellipse(w * .68, h * .62, w * .085, h * .05, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = .4; ctx.fillStyle = '#e08a62';
    ctx.beginPath(); ctx.ellipse(w * .68, h * .62, w * .055, h * .03, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    speckle(ctx, w, h, 90, r, ['#e8d0a8', '#8f5c38'], 2, .25);
  },
  saturn: function(ctx, w, h){
    ctx.fillStyle = '#e3cf9e'; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#e8d5a8', '#d9bd85', '#e4cf9f', '#cbb077', '#e6d2a4', '#d2b57e'], 1.6, 66);
  },
  uranus: function(ctx, w, h){
    ctx.fillStyle = '#9fd3dd'; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#a5d8e2', '#97cdd8', '#aadbe4', '#92c8d4'], 1.2, 77);
  },
  neptune: function(ctx, w, h){
    ctx.fillStyle = '#2f55c4'; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#3a63d2', '#2b4bb8', '#4a6fd0', '#27469f'], 2, 88);
    var r = mulberry(89);
    ctx.globalAlpha = .8; ctx.fillStyle = '#1d3a8f';
    ctx.beginPath(); ctx.ellipse(w * .3, h * .55, w * .07, h * .045, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = .5; ctx.fillStyle = '#bcd2ff';
    ctx.beginPath(); ctx.ellipse(w * .55, h * .35, w * .1, h * .02, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    speckle(ctx, w, h, 60, r, ['#6f8fe0', '#22387f'], 2, .3);
  },
  // generic reusable moon surfaces
  cratered: function(ctx, w, h){
    ctx.fillStyle = '#b5b0a8'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(91);
    speckle(ctx, w, h, 220, r, ['#9a948c', '#c2bcb2', '#8a847c'], 2.5, .4);
    craters(ctx, w, h, 150, r);
  },
  mottled: function(ctx, w, h){
    ctx.fillStyle = '#a89a88'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(92);
    speckle(ctx, w, h, 260, r, ['#8f8272', '#b8a992', '#7d7264'], 3, .35);
    craters(ctx, w, h, 60, r);
  },
  icy: function(ctx, w, h){
    ctx.fillStyle = '#e8f0f4'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(93);
    speckle(ctx, w, h, 120, r, ['#cfe0ea', '#f6fbff', '#bcd2de'], 2, .35);
  },
  io: function(ctx, w, h){
    ctx.fillStyle = '#d8c25a'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(94);
    speckle(ctx, w, h, 200, r, ['#c4a440', '#e8d878', '#b89838'], 2.5, .5);
    for (var i = 0; i < 26; i++){ ctx.globalAlpha = .8; ctx.fillStyle = '#8a2a1a';
      ctx.beginPath(); ctx.arc(r() * w, r() * h, 1.5 + r() * 4, 0, 6.283); ctx.fill(); }
    for (var j = 0; j < 18; j++){ ctx.globalAlpha = .6; ctx.fillStyle = '#c46a2a';
      ctx.beginPath(); ctx.arc(r() * w, r() * h, 2 + r() * 5, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
  },
  europa: function(ctx, w, h){
    ctx.fillStyle = '#cfc4ae'; ctx.fillRect(0, 0, w, h);
    var r = mulberry(95);
    speckle(ctx, w, h, 140, r, ['#c2b498', '#d8ccb4', '#b8a888'], 2.5, .35);
    for (var i = 0; i < 26; i++){
      ctx.strokeStyle = 'rgba(150,110,70,' + (.25 + r() * .35) + ')';
      ctx.lineWidth = 1 + r() * 1.6;
      var x = r() * w, y = r() * h;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (var s = 0; s < 7; s++){ x += (r() - .5) * 40; y += (r() - .5) * 30; ctx.lineTo(x, y); }
      ctx.stroke();
    }
  },
  titan: function(ctx, w, h){
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#e0b060'); g.addColorStop(.5, '#cf9a44'); g.addColorStop(1, '#e0b060');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    stripes(ctx, w, h, ['#d8a850', '#c89440', '#ddb068', '#c08c3c'], 2, 96);
    speckle(ctx, w, h, 60, mulberry(97), ['#e8c078', '#b8843a'], 3, .2);
  }
};

function makeSurfaceTex(key){
  return canvasTex(512, 256, function(ctx, w, h){ PAINTERS[key](ctx, w, h); });
}

// ring textures (planar mapping: canvas radius fraction = geomR / outerR)
function ringTexture(innerFrac, base, alphaMul, gappy){
  return canvasTex(1024, 1024, function(ctx, w, h){
    var c = w / 2;
    var g = ctx.createRadialGradient(c, c, c * innerFrac, c, c, c);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(.1, 'rgba(' + base + ',' + (0.55 * alphaMul) + ')');
    g.addColorStop(.3, 'rgba(' + base + ',' + (0.85 * alphaMul) + ')');
    g.addColorStop(.5, 'rgba(' + base + ',' + (0.7 * alphaMul) + ')');
    g.addColorStop(.66, gappy ? 'rgba(20,15,10,0.06)' : 'rgba(' + base + ',' + (0.5 * alphaMul) + ')');
    g.addColorStop(.7, 'rgba(' + base + ',' + (0.8 * alphaMul) + ')');
    g.addColorStop(.85, 'rgba(' + base + ',' + (0.4 * alphaMul) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (gappy){
      ctx.strokeStyle = 'rgba(15,12,8,0.75)';
      ctx.lineWidth = w * 0.045;
      ctx.beginPath(); ctx.arc(c, c, c * (innerFrac + (1 - innerFrac) * .66), 0, 6.283); ctx.stroke();
    }
  });
}
function glowTexture(){
  return canvasTex(256, 256, function(ctx, w, h){
    var c = w / 2;
    var g = ctx.createRadialGradient(c, c, 0, c, c, c);
    g.addColorStop(0, 'rgba(255,225,160,1)');
    g.addColorStop(.2, 'rgba(255,180,80,.55)');
    g.addColorStop(.55, 'rgba(255,130,40,.18)');
    g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
}

function circleLine(radius, color, opacity){
  var pts = [];
  for (var i = 0; i <= 128; i++){ var a = i / 128 * TWO_PI; pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius)); }
  var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity }));
  return l;
}
function makeLabel(text, isMoon){
  var d = document.createElement('div');
  d.className = 'lbl' + (isMoon ? ' moon' : '');
  d.textContent = text;
  document.getElementById('labels').appendChild(d);
  return d;
}

PLANETS.forEach(function(p, idx){

    new THREE.MeshStandardMaterial({ map: makeSurfaceTex(p.tex), roughness: 1, metalness: 0 }));
  tiltG.add(mesh);

  if (p.rings){
    var inner = p.radius * p.rings.inner, outer = p.radius * p.rings.outer;
    var rm = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 128),

  group.add(pick);

  var body = { id: p.id, name: p.name, isSun: false, radius: p.radius, dist: p.dist, period: p.period,
    rotDays: p.rotDays, color: p.color, group: group, mesh: mesh, tiltG: tiltG,
    phase: idx * 2.39996 + 0.7, info: p.info, moons: [] };
  pick.userData.body = body;
  mesh.userData.body = body;
  body.label = makeLabel(body.name, false);

  var orbit = circleLine(p.dist, p.color, 0.35);
  scene.add(orbit); orbitLines.push(orbit);

  (p.moons || []).forEach(function(m){
    var pivot = new THREE.Group();
    pivot.rotation.y = rng() * TWO_PI;

      new THREE.MeshStandardMaterial({ map: sharedTex[m.tex] || sharedTex.cratered, color: m.color, roughness: 1, metalness: 0 }));

    var mpick = new THREE.Mesh(new THREE.SphereGeometry(Math.max(m.radius * 2.4, 0.55), 10, 6), new THREE.MeshBasicMaterial({ visible: false }));

      label: makeLabel(m.name, true) });

// starfield
function starCloud(n, size, rmin, rmax, seed){
  var pos = new Float32Array(n * 3), col = new Float32Array(n * 3), r = mulberry(seed);
  var palette = [[1, 1, 1], [0.8, 0.86, 1], [1, 0.9, 0.75], [0.75, 0.85, 1]];
  for (var i = 0; i < n; i++){
    var u = r() * 2 - 1, t = r() * TWO_PI, s = Math.sqrt(1 - u * u), d = rmin + r() * (rmax - rmin);
    pos[i * 3] = s * Math.cos(t) * d; pos[i * 3 + 1] = u * d; pos[i * 3 + 2] = s * Math.sin(t) * d;
    var c = palette[(r() * palette.length) | 0], b = .5 + r() * .5;
    col[i * 3] = c[0] * b; col[i * 3 + 1] = c[1] * b; col[i * 3 + 2] = c[2] * b;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var p = new THREE.Points(g, new THREE.PointsMaterial({ size: size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: .95 }));
  scene.add(p);
}

// ---------- input: pointer ----------
var el = renderer.domElement;
var pointers = new Map();
var downX = 0, downY = 0, downT = 0, moved = 0;
var pinchDist = 0;
var ndc = new THREE.Vector2();
var raycaster = new THREE.Raycaster();

function setNdc(e){
  var r = el.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
el.addEventListener('pointerdown', function(e){
  el.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){
    downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = 0;
    recentering = false;
  } else if (pointers.size === 2){
    var ps = Array.from(pointers.values());
    pinchDist = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
  }
});
el.addEventListener('pointermove', function(e){
  var prev = pointers.get(e.pointerId);
  if (prev && pointers.size === 1 && e.buttons !== 0){
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    moved += Math.abs(dx) + Math.abs(dy);
    var panning = e.buttons & 2 || e.ctrlKey || e.metaKey;
    if (panning){
      var fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
      var right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
      var up = new THREE.Vector3().crossVectors(right, fwd).normalize();
      var k = curRadius * 0.0011;
      panOffset.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
      panOffset.clampLength(0, curRadius * 2);
      thetaVel = 0; phiVel = 0;
    } else {
      theta += -dx * 0.0052;
      phi += -dy * 0.0052;
      thetaVel = -dx * 0.0052 * 60;
      phiVel = -dy * 0.0052 * 60;
    }
    phi = clamp(phi, 0.04, Math.PI - 0.04);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  } else if (prev && pointers.size === 2){
    prev.x = e.clientX; prev.y = e.clientY;
    var ps = Array.from(pointers.values());
    var d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
    if (pinchDist > 0 && d > 0){
      desiredRadius = clamp(desiredRadius * pinchDist / d, minRadius(), maxRadius);
    }
    pinchDist = d;
  } else {
    // hover (no button)
    setNdc(e);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickMeshes, false);
    hoverBody = hits.length ? hits[0].object.userData.body : null;
    if (hoverBody){
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 10) + 'px';
      tooltip.textContent = hoverBody.name + (hoverBody.isSun ? '' : ' — click to fly by');
      el.style.cursor = 'pointer';
    } else {
      tooltip.style.display = 'none';
      el.style.cursor = 'grab';
    }
  }
});
function onPointerUp(e){
  pointers.delete(e.pointerId);
  pinchDist = 0;
  if (pointers.size === 0){
    var quick = performance.now() - downT < 600 && moved < 7;
    if (quick && (e.type === 'pointerup')){
      setNdc(e);
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObjects(pickMeshes, false);
      if (hits.length){
        select(hits[0].object.userData.body);
      } else if (e.pointerType === 'mouse' && e.button === 0){
        // clicked empty space while following: recenter
        if (focus) recenterView();
      }
    }
    thetaVel = 0; phiVel = 0;
  }
}
el.addEventListener('pointerup', onPointerUp);
el.addEventListener('pointercancel', onPointerUp);
el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
el.addEventListener('wheel', function(e){
  e.preventDefault();
  desiredRadius = clamp(desiredRadius * Math.exp(e.deltaY * 0.0011), minRadius(), maxRadius);
}, { passive: false });
el.style.cursor = 'grab';

// keyboard
addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); togglePause(); }
  else if (e.key === 'Escape'){ setOverview(); }
  else if (e.key === '+' || e.key === '=') desiredRadius = clamp(desiredRadius * 0.82, minRadius(), maxRadius);
  else if (e.key === '-' || e.key === '_') desiredRadius = clamp(desiredRadius / 0.82, minRadius(), maxRadius);
  else if (e.key === 't' || e.key === 'T') toggleTour();
  else if (e.key === 'o' || e.key === 'O') document.getElementById('orbits').click();
  else if (e.key === 'l' || e.key === 'L') document.getElementById('labels').click();
  else {
    var n = parseInt(e.key, 10);
    if (!isNaN(n) && n >= 0 && n <= 8) select(allBodies[n]);
    else {
      var idx = '12345678'.indexOf(e.key);
      if (idx >= 0) select(allBodies[idx + 1]);
    }
  }
});

/* one-time sanity check: sample the centre of the frame (the sun's glow is
   there in the default view). If it is all black, WebGL is likely not
   actually drawing — surface that instead of a silent black screen. */
function checkRender(){
  if (renderChecked) return;
  renderChecked = true;
  try{
    var gl = renderer.getContext();
    var w = renderer.domElement.width, h = renderer.domElement.height, n = 8;
    var buf = new Uint8Array(n * n * 4);
    gl.readPixels((w >> 1) - (n >> 1), (h >> 1) - (n >> 1), n, n, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    var max = 0;
    for (var i = 0; i < n * n; i++){
      var s = buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2];
      if (s > max) max = s;
    }
    if (max < 20){
      console.warn('Solar system: the rendered frame is black (max channel-sum ' + max + '). WebGL may not be drawing — check hardware acceleration / GPU drivers.');
      statusEl.textContent = '⚠ 3D frame is black — check that your browser has hardware acceleration / WebGL enabled.';
    }
  } catch (e) { /* readPixels can be unavailable; ignore */ }
}

function damp(x, y, lambda, dt){ return THREE.MathUtils.damp(x, y, lambda, dt); }

function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  var s = playing ? dt * speed : 0;
  simYears += s / YEAR_SEC;

  // bodies
  for (var i = 0; i < allBodies.length; i++){
    var b = allBodies[i];
    if (b.isSun){
      b.mesh.rotation.y += s * 0.06;
      continue;
    }
    var a = b.phase + (simYears / b.period) * TWO_PI;
    b.group.position.set(Math.cos(a) * b.dist, 0, Math.sin(a) * b.dist);
    b.mesh.rotation.y += s * (TWO_PI / (Math.abs(b.rotDays) * DAY_SEC)) * Math.sign(b.rotDays);
    for (var j = 0; j < b.moons.length; j++){
      var m = b.moons[j];
      m.phase += s * TWO_PI / m.def.periodSec;
      m.pivot.rotation.y = m.phase * m.dir;
    }
  }
  belt.rotation.y = simYears * TWO_PI / 12;

  // tour
  if (tour.active){
    tour.t += dt;
    if (tour.t > 13){
      tour.t = 0;
      tour.i = (tour.i + 1) % (allBodies.length - 1);
      select(allBodies[tour.i + 1], true);
    }
  }

  // focus target
  var target = focus ? focus.group.position : tmpV.set(0, 0, 0);
  if (focus) tmpV.copy(target); else tmpV.set(0, 0, 0);
  curTarget.lerp(tmpV, 1 - Math.exp(-5 * dt));

  // radius + rotation inertia
  desiredRadius = clamp(desiredRadius, minRadius(), maxRadius);
  curRadius = damp(curRadius, desiredRadius, 6, dt);
  if (driftOn && pointers.size === 0) theta += 0.05 * dt;
  if (pointers.size === 0){
    theta += thetaVel * dt;
    phi = clamp(phi + phiVel * dt, 0.04, Math.PI - 0.04);
    thetaVel *= Math.exp(-3 * dt);
    phiVel *= Math.exp(-3 * dt);
  }
  if (recentering) panOffset.multiplyScalar(Math.exp(-6 * dt));
  if (panOffset.lengthSq() < 1e-6) recentering = false;

  // camera
  sph.set(curRadius, phi, theta);
  camera.position.setFromSpherical(sph).add(curTarget).add(panOffset);
  camera.lookAt(curTarget.clone().add(panOffset));

  renderer.render(scene, camera);
  if (!renderChecked && performance.now() - startTime > 3000) checkRender();

  // labels (after render so matrices are fresh)
  var W = innerWidth, H = innerHeight;
  for (var li = 0; li < labelEls.length; li++){
    var le = labelEls[li], b2 = le.body;
    if (!labelsOn){ le.el.style.display = 'none'; continue; }
    var show = !b2.isSun && b2 === focus && curRadius < b2.radius * 10;
    if (b2.isSun || b2 !== focus){
      b2.group.getWorldPosition(tmpV);
      tmpV.y += b2.radius * 2.4 + 0.4;
      tmpV.project(camera);
      var behind = tmpV.z > 1;
      if (!behind && tmpV.x > -1.1 && tmpV.x < 1.1 && tmpV.y > -1.1 && tmpV.y < 1.1){
        le.el.style.display = 'block';
        le.el.style.left = ((tmpV.x * .5 + .5) * W) + 'px';
        le.el.style.top = ((-tmpV.y * .5 + .5) * H) + 'px';
      } else le.el.style.display = 'none';
    } else {
      le.el.style.display = 'none'; // focus target is under the camera; hide its own label
    }
  }
  // moon labels
  for (var mi = 0; mi < allBodies.length; mi++){
    var bb = allBodies[mi];
    var moonShow = !bb.isSun && bb === focus && labelsOn;
    for (var mj = 0; mj < bb.moons.length; mj++){
      var mm2 = bb.moons[mj];
      if (moonShow && curRadius < bb.radius * 12){
        mm2.mesh.getWorldPosition(tmpV);
        tmpV.y += mm2.def.radius * 2.5 + 0.15;
        tmpV.project(camera);
        if (tmpV.z > 1){ mm2.label.style.display = 'none'; continue; }
        mm2.label.style.display = 'block';
        mm2.label.style.left = ((tmpV.x * .5 + .5) * W) + 'px';
        mm2.label.style.top = ((-tmpV.y * .5 + .5) * H) + 'px';
      } else mm2.label.style.display = 'none';
    }
  }

  // status line
  var st = focus ?
    'Following ' + focus.name + ' \u00b7 ' + (curRadius / focus.radius).toFixed(1) + '\u00d7 body size' :
    'Free flight \u2014 click any planet to fly by';
  if (st !== lastStatus){ lastStatus = st; statusEl.textContent = st; }
}

tick();
} // end main
})();
</script>
<script>
/* safety net: if the ES-module script above never executes (very old browser
   with no module support), surface a message instead of a silent black page */
setTimeout(function(){
  var b = document.getElementById('boot');
  if (b && b.style.display !== 'none' && !window.__appStarted){
    b.innerHTML = 'Still loading\u2026 or your browser may not support ES modules.<br/>Please use a recent Chrome, Edge, Firefox or Safari.';
  }
}, 12000);
</script>
