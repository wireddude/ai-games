<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Solar System Explorer — Learn the Planets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #scene { width: 100%; height: 100%; display: block; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  /* ---- HUD ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: #fff; pointer-events: none; z-index: 10;
  }
  #hud > * { pointer-events: auto; }
  #title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #title span { color: #ffd54a; }
  #controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfd8dc; }
  .ctl label { white-space: nowrap; }
  input[type=range] { width: 130px; accent-color: #ffd54a; cursor: pointer; }
  #speedVal { min-width: 52px; text-align: center; font-weight: 600; color: #ffd54a; }
  button {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: rgba(255,255,255,0.25); }
  #resetBtn { background: rgba(255,77,77,0.25); border-color: rgba(255,77,77,0.5); }
  #resetBtn:hover { background: rgba(255,77,77,0.45); }
  #soundBtn { background: rgba(77,255,180,0.2); border-color: rgba(77,255,180,0.4); }
  #soundBtn:hover { background: rgba(77,255,180,0.35); }
  #soundBtn.muted { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #888; }
  #physicsBtn { background: rgba(255,180,77,0.2); border-color: rgba(255,180,77,0.4); }
  #physicsBtn:hover { background: rgba(255,180,77,0.35); }
  #physicsBtn.active { background: rgba(255,180,77,0.5); border-color: rgba(255,180,77,0.8); color: #fff; }
  #pauseBtn.active { background: rgba(77,180,255,0.35); border-color: rgba(77,180,255,0.6); }
  #todayBtn { background: rgba(120,140,255,0.18); border-color: rgba(120,140,255,0.4); }
  #todayBtn:hover { background: rgba(120,140,255,0.32); }
  @media (pointer: coarse) {
    button { padding: 10px 14px; font-size: 14px; }
    input[type=range] { width: 120px; }
    .ctl label { font-size: 14px; }
    #title { font-size: 18px; }
  }
  /* ---- Tooltip ---- */
  #tooltip {
    position: absolute; display: none; pointer-events: none; z-index: 20;
    background: rgba(10,14,20,0.92); color: #fff; border: 1px solid rgba(255,213,74,0.5);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.5;
    max-width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  #tooltip h3 { color: #ffd54a; font-size: 15px; margin-bottom: 4px; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .row b { color: #90a4ae; font-weight: 500; }
  /* ---- Info Panel ---- */
  #infoPanel {
    position: absolute; top: 70px; right: 14px; width: 340px; max-width: calc(100vw - 20px);
    max-height: calc(100vh - 90px); overflow-y: auto;
    background: rgba(12,16,28,0.96); color: #fff; border: 1px solid rgba(255,213,74,0.35);
    border-radius: 14px; padding: 16px 18px; z-index: 15; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); pointer-events: auto;
  }
  #infoPanel h2 { color: #ffd54a; font-size: 20px; margin-bottom: 6px; display:flex; align-items:center; gap:8px; }
  #infoPanel .sub { color: #90a4ae; font-size: 12px; margin-bottom: 12px; }
  #infoPanel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  #infoPanel .stat { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 10px; }
  #infoPanel .stat b { display:block; font-size: 11px; color: #90a4ae; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
  #infoPanel .stat span { font-size: 13px; color: #fff; font-weight: 600; }
  #infoPanel .desc { font-size: 13px; line-height: 1.5; color: #cfd8dc; margin-top: 10px; }
  #infoPanel .bar { height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; margin-top: 6px; overflow:hidden; }
  #infoPanel .bar i { display:block; height:100%; background: #ffd54a; border-radius:2px; }
  #infoClose { position:absolute; top:10px; right:12px; background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); padding:4px 8px; font-size:12px; }
  #infoPanel::-webkit-scrollbar { width:6px; } #infoPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius:3px; }
  @media (max-width: 600px){ #infoPanel { left:10px; right:10px; width:auto; top:60px; max-height: 60vh; } }
  /* ---- Help ---- */
  #help {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #b0bec5; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 8px 16px; font-size: 12px; text-align: center;
    pointer-events: none; z-index: 10; white-space: nowrap;
  }
  #help b { color: #fff; }
  @media (max-width: 900px){ #help { font-size: 10px; padding: 6px 10px; } }
  @media (max-width: 700px){ #help { display:none; } }
  #physicsHint {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(255,180,77,0.15); color: #ffcc88; border: 1px solid rgba(255,180,77,0.4);
    border-radius: 8px; padding: 6px 14px; font-size: 12px; z-index: 10; display: none; pointer-events: none;
  }
  #dateLabel {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(120,140,255,0.15); color: #c5caef; border: 1px solid rgba(120,140,255,0.3);
    border-radius: 8px; padding: 6px 14px; font-size: 12px; z-index: 10; display: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0"></canvas>

<div id="hud">
  <div id="title">🪐 Solar System <span>Explorer</span></div>
  <div id="controls">
    <div class="ctl">
      <label>⏩ Speed</label>
      <input type="range" id="speed" min="0" max="100" value="20">
      <span id="speedVal">1×</span>
    </div>
    <button id="pauseBtn" title="Pause / resume (Space)">⏸ Pause</button>
    <button id="todayBtn" title="Align to today's real positions">📅 Today</button>
    <button id="resetBtn" title="Reset camera & time">↺ Reset</button>
    <button id="soundBtn" title="Toggle space ambience">🔇 Sound</button>
    <button id="physicsBtn" title="Toggle physics/crash mode">⚛ Physics OFF</button>
  </div>
</div>

<div id="tooltip"></div>
<div id="infoPanel">
  <button id="infoClose">✕</button>
  <h2 id="infoName">Planet</h2>
  <div class="sub" id="infoSub"></div>
  <div class="grid" id="infoGrid"></div>
  <div class="desc" id="infoDesc"></div>
  <div style="margin-top:12px; display:flex; gap:8px;">
    <button id="infoFlyBtn">🔭 Fly to</button>
    <button id="infoSoundBtn">🔊 Solo sound</button>
  </div>
</div>
<div id="physicsHint">⚛ Physics ON — drag planets to move them! They will crash on collision 💥</div>
<div id="dateLabel"></div>
<div id="help">
  <b>Drag</b> to orbit · <b>Scroll</b> to zoom · <b>WASD / Arrows</b> move · <b>Q/E</b> up/down · <b>Space</b> pause · <b>Click</b> planet to fly · <b>Physics</b> to drag & crash
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   SOLAR SYSTEM EXPLORER — enhanced v2
   tilts, info panel, per-planet sounds, pause, today alignment
   ============================================================ */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 45, 95);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 400;

/* ---------- Lighting ---------- */
const sunLight = new THREE.PointLight(0xffffff, 2.2, 0, 0);
sunLight.position.set(0,0,0);
scene.add(sunLight);
const ambient = new THREE.AmbientLight(0x334455, 0.35);
scene.add(ambient);

/* ---------- Stars ---------- */
(function makeStars(){
  const geo = new THREE.BufferGeometry();
  const n = 4000, pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 400 + Math.random()*600;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.7, sizeAttenuation:true });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------- Data with tilts & facts ---------- */
const PLANETS = [
  { name:'Mercury', color:0x9c9c9c, period:87.97,  dist:0.39,  radius:0.38, tilt:0.034, mass:0.055, gravity:3.7, temp:'-173 to 427°C', dayLen:'1407h', comp:'Rocky, thin exosphere', sound:'whisper', info:'Smallest planet, closest to the Sun. A year here is just 88 days!' },
  { name:'Venus',   color:0xe8c07a, period:224.7,  dist:0.72,  radius:0.95, tilt:177.36, mass:0.815, gravity:8.87, temp:'462°C avg', dayLen:'5832h retro', comp:'CO₂ 96%, sulfuric clouds', sound:'hiss', info:'Hottest planet — thick CO₂ traps heat. Spins backwards!' },
  { name:'Earth',   color:0x4a90d9, period:365.25, dist:1.0,   radius:1.0,  tilt:23.44, mass:1, gravity:9.81, temp:'-88 to 58°C', dayLen:'24h', comp:'N₂/O₂, 71% water', sound:'hum', info:'Our home. The only known place with life. Has 1 moon.' },
  { name:'Mars',    color:0xd96a4a, period:686.98, dist:1.52,  radius:0.53, tilt:25.19, mass:0.107, gravity:3.71, temp:'-153 to 20°C', dayLen:'24.6h', comp:'CO₂ thin, iron oxide dust', sound:'wind', info:'Red Planet — Olympus Mons, tallest volcano.' },
  { name:'Jupiter', color:0xd8b48a, period:4332.6, dist:5.2,   radius:11.2, tilt:3.13, mass:317.8, gravity:24.79, temp:'-145°C', dayLen:'9.9h', comp:'H/He gas giant', sound:'jupiter', info:'Biggest planet — Great Red Spot storm larger than Earth.' },
  { name:'Saturn',  color:0xe6d9a8, period:10759,  dist:9.58,  radius:9.45, tilt:26.73, mass:95.2, gravity:10.44, temp:'-178°C', dayLen:'10.7h', comp:'H/He, icy rings', sound:'saturn', info:'Famous for beautiful rings of ice and rock.' },
  { name:'Uranus',  color:0x9ad6e0, period:30688,  dist:19.2,  radius:4.0,  tilt:97.77, mass:14.5, gravity:8.69, temp:'-224°C', dayLen:'17.2h retro', comp:'H/He/water/ammonia ices', sound:'ice', info:'Ice giant tipped 98° — rolls on its side!' },
  { name:'Neptune', color:0x4a6ad9, period:60182,  dist:30.05, radius:3.88, tilt:28.32, mass:17.1, gravity:11.15, temp:'-218°C', dayLen:'16.1h', comp:'H/He/methane deep blue', sound:'deep', info:'Farthest planet. Supersonic winds 2,000 km/h.' },
];
// Mean longitude at J2000 epoch (deg) for today alignment
const L0 = { Mercury:252.25, Venus:181.98, Earth:100.466, Mars:355.433, Jupiter:34.351, Saturn:50.078, Uranus:313.232, Neptune:304.88 };

const DIST_SCALE = 10, DIST_POW = 0.6;
const SIZE_SCALE = 0.5, SIZE_POW = 0.5;
const distOf = au => DIST_SCALE * Math.pow(au, DIST_POW);
const sizeOf = rel => SIZE_SCALE * Math.pow(rel, SIZE_POW);

/* ---------- Sun ---------- */
const SUN_RADIUS = sizeOf(109);
const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color:0xffd54a });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);
const glowTex = (function(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'rgba(255,213,74,0.9)');
  grad.addColorStop(0.4,'rgba(255,160,40,0.35)');
  grad.addColorStop(1,'rgba(255,120,20,0)');
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, blending:THREE.AdditiveBlending, depthWrite:false }));
glow.scale.set(30,30,1);
scene.add(glow);

let coronaMesh;
(function makeCorona(){
  const geo = new THREE.SphereGeometry(SUN_RADIUS*1.25, 64, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, baseColor: { value: new THREE.Color(0xff8c1a) } },
    vertexShader: `varying vec3 vNormal; varying vec3 vPos; void main(){ vNormal = normalize(normalMatrix * normal); vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float time;
      uniform vec3 baseColor;
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
        float intensity = pow(0.65 - dot(vNormal, vec3(0.0,0.0,1.0)), 2.0);
        float flicker = 0.85 + 0.15 * sin(time*2.3 + length(vPos)*0.1);
        float pulse = 0.9 + 0.1 * sin(time*0.9);
        vec3 col = baseColor * flicker * pulse;
        float alpha = intensity * 0.55;
        gl_FragColor = vec4(col, alpha);
      }`,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });
  coronaMesh = new THREE.Mesh(geo, mat);
  scene.add(coronaMesh);
})();
let coronaMat2;
(function makeCorona2(){
  const geo = new THREE.SphereGeometry(SUN_RADIUS*1.55, 32, 32);
  const mat = new THREE.MeshBasicMaterial({ color:0xff6a00, transparent:true, opacity:0.08, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false });
  const m = new THREE.Mesh(geo, mat);
  coronaMat2 = mat;
  scene.add(m);
})();
const coronaSprites = [];
(function makeCoronaSprites(){
  for(let i=0;i<2;i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xff8800, blending:THREE.AdditiveBlending, transparent:true, opacity:0.15, depthWrite:false }));
    s.scale.set(40+i*14,40+i*14,1);
    s.position.set(0,0,0);
    scene.add(s);
    coronaSprites.push(s);
  }
})();

const flares = [];
function spawnFlare(){
  if(Math.random() < 0.5) return;
  const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
  const r = SUN_RADIUS*0.98;
  const start = new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  const dir = start.clone().normalize();
  const spriteMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffffaa, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false });
  const sp = new THREE.Sprite(spriteMat);
  sp.position.copy(start);
  sp.scale.set(2,2,1);
  scene.add(sp);
  flares.push({ sprite: sp, pos: start.clone(), vel: dir.clone().multiplyScalar(8 + Math.random()*10), life:0, maxLife: 1.2 + Math.random()*0.8 });
}
setInterval(spawnFlare, 900);

/* ---------- Build planets (with axial tilt groups) ---------- */
const bodies = [];
const orbitLines = [];

function makePlanet(p){
  const radius = sizeOf(p.radius);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 32),
    new THREE.MeshStandardMaterial({ color:p.color, roughness:0.9, metalness:0.1 })
  );
  // tilt group: holds mesh tilted, spins mesh inside
  const tiltGroup = new THREE.Group();
  // apply axial tilt as rotation around X (or Z). Use X.
  const tiltRad = p.tilt * Math.PI/180;
  // For Venus retrograde >90, also flip
  tiltGroup.rotation.x = tiltRad;
  // slight initial spin Y offset
  mesh.rotation.y = Math.random()*Math.PI*2;
  tiltGroup.add(mesh);
  const d = distOf(p.dist);
  const angle = Math.random()*Math.PI*2;
  tiltGroup.position.set(Math.cos(angle)*d, 0, Math.sin(angle)*d);
  scene.add(tiltGroup);
  const body = { mesh, tiltGroup, period:p.period, angle, dist:d, name:p.name, info:p.info, color:p.color, isMoon:false, radius, mass:p.mass, gravity:p.gravity, temp:p.temp, dayLen:p.dayLen, comp:p.comp, tilt:p.tilt, sound:p.sound, velocity:new THREE.Vector3(), isPhysics:false, exploded:false, orig:{dist:d, angle} };
  bodies.push(body);
  const pts = [];
  for(let i=0;i<=128;i++){ const a=i/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*d,0,Math.sin(a)*d)); }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.12 })
  );
  scene.add(line); orbitLines.push(line);
  if(p.name==='Saturn'){
    // rings must be in tiltGroup but perpendicular to spin axis? Rings lie in equatorial plane, so add to tiltGroup and tilt already
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(radius*1.3, radius*2.2, 64),
      new THREE.MeshBasicMaterial({ color:0xd8c9a0, side:THREE.DoubleSide, transparent:true, opacity:0.7 })
    );
    ring.rotation.x = Math.PI/2; // equatorial
    mesh.add(ring);
    // ensure rings spin with mesh
  }
  return body;
}
PLANETS.forEach(makePlanet);

// Moons
const MOON_DEFS = {
  'Earth': [
    { name:'Moon', radius:0.27, dist:2.6, period:27.3, color:0xbbbbbb, info:"Earth's Moon — causes tides and stabilizes tilt." }
  ],
  'Mars': [
    { name:'Phobos', radius:0.08, dist:1.4, period:0.32, color:0x9e8a7a, info:'Tiny moon of Mars, skims just 6,000 km above surface.' },
    { name:'Deimos', radius:0.06, dist:2.2, period:1.26, color:0xb0a090, info:'Smaller Mars moon.' }
  ],
  'Jupiter': [
    { name:'Io', radius:0.29, dist:1.25, period:1.77, color:0xe8c96a, info:'Most volcanically active world — sulfur volcanoes!' },
    { name:'Europa', radius:0.24, dist:1.65, period:3.55, color:0xcde6ff, info:'Icy ocean moon — may harbor life.' },
    { name:'Ganymede', radius:0.41, dist:2.1, period:7.15, color:0xa99e93, info:'Largest moon in solar system.' },
    { name:'Callisto', radius:0.38, dist:2.55, period:16.69, color:0x6b5d4f, info:'Ancient cratered ice ball.' }
  ],
  'Saturn': [
    { name:'Titan', radius:0.40, dist:2.0, period:15.95, color:0xd9a86a, info:'Thick atmosphere, methane lakes.' },
    { name:'Enceladus', radius:0.10, dist:1.25, period:1.37, color:0xeef6ff, info:'Shoots geysers of water.' },
    { name:'Rhea', radius:0.12, dist:1.65, period:4.52, color:0xc0c0c0, info:'Icy moon with faint rings.' }
  ],
  'Uranus': [
    { name:'Miranda', radius:0.07, dist:1.15, period:1.41, color:0xaaaaaa, info:'Patchwork Frankenstein terrain.' },
    { name:'Ariel', radius:0.09, dist:1.45, period:2.52, color:0xddd8cc, info:'Brightest Uranian moon.' },
    { name:'Titania', radius:0.12, dist:1.85, period:8.71, color:0x9a8a7a, info:'Largest Uranus moon.' }
  ],
  'Neptune': [
    { name:'Triton', radius:0.21, dist:1.55, period:-5.88, color:0xd080a0, info:'Retrograde — orbits backwards!' },
    { name:'Proteus', radius:0.08, dist:1.15, period:1.12, color:0x555555, info:'Dark captured asteroid.' }
  ]
};

function addMoons(){
  for(const [planetName, moons] of Object.entries(MOON_DEFS)){
    const parent = bodies.find(b=>b.name===planetName);
    if(!parent) continue;
    moons.forEach(m=>{
      if(planetName==='Earth' && bodies.some(b=>b.name==='Moon')) return;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(sizeOf(m.radius), 20, 20),
        new THREE.MeshStandardMaterial({ color:m.color, roughness:0.9 })
      );
      mesh.userData.radius = sizeOf(m.radius);
      const finalDist = parent.radius * m.dist * 1.1;
      const angle = Math.random()*Math.PI*2;
      const period = Math.abs(m.period);
      const retro = m.period < 0;
      mesh.position.set(Math.cos(angle)*finalDist, 0, Math.sin(angle)*finalDist);
      parent.tiltGroup.add(mesh); // add to parent tiltGroup so moons follow planet position & stay in equatorial plane
      const info = m.info;
      bodies.push({ mesh, tiltGroup: parent.tiltGroup, period, angle, dist:finalDist, name:m.name, info, color:m.color, isMoon:true, parent, radius:sizeOf(m.radius), retro, velocity:new THREE.Vector3(), isPhysics:false, exploded:false });
      const pts=[]; for(let i=0;i<=64;i++){ const a=i/64*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*finalDist,0,Math.sin(a)*finalDist)); }
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:m.color, transparent:true, opacity:0.07}));
      parent.tiltGroup.add(line);
    });
  }
}

let asteroidPoints = null;

(function makeAsteroidBelt(){
  const count = 1200;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count*3);
  const colors = new Float32Array(count*3);
  const baseColor = new THREE.Color(0x8a7e6a);
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const r = distOf(2.2) + Math.random()*(distOf(3.3)-distOf(2.2));
    const y = (Math.random()-0.5)*1.2;
    const x = Math.cos(a)*r;
    const z = Math.sin(a)*r;
    positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
    const c = baseColor.clone().multiplyScalar(0.7 + Math.random()*0.6);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    asteroidData.push({ dist:r, angle:a, y, speed: (2*Math.PI)/(900+Math.random()*1200) });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const mat = new THREE.PointsMaterial({ size:0.22, vertexColors:true, transparent:true, opacity:0.9, sizeAttenuation:true });
  asteroidPoints = new THREE.Points(geo, mat);

})();

const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;

  if(e.key==='+'||e.key==='=') camera.position.multiplyScalar(0.9);

});

function moveCamera(dt){
  const s = 30*dt;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
  const dir = new THREE.Vector3();
  if(keys['w']||keys['arrowup'])    dir.add(fwd);
  if(keys['s']||keys['arrowdown'])  dir.sub(fwd);
  if(keys['a']||keys['arrowleft'])  dir.sub(right);
  if(keys['d']||keys['arrowright']) dir.add(right);
  if(keys['q']) dir.y += 1;
  if(keys['e']) dir.y -= 1;
  if(dir.lengthSq()>0){ dir.normalize().multiplyScalar(s); camera.position.add(dir); }
}

/* ---------- Audio: ambience + per-planet sounds ---------- */
let audioCtx = null;
let masterGain = null;
let soundEnabled = false;
let noiseSource = null;
let noiseGain = null;
let humOsc = null;
let humGain = null;
let lfoOsc = null;
let lfoGain = null;
let filter = null;
let planetSounds = {}; // name -> {osc,gain,filter,lfo}
let soloPlanet = null;

function planetSoundConfig(b){
  // map sound type to oscillator settings
  const cfg = {
    mercury: { freq: 220, type:'sine', gain:0.015, mod:0.3 },
    whisper: { freq: 300, type:'sine', gain:0.012 },
    hiss:    { freq: 180, type:'triangle', gain:0.014 },
    hum:     { freq: 55,  type:'sine', gain:0.018 },
    wind:    { freq: 140, type:'triangle', gain:0.013 },
    jupiter: { freq: 90,  type:'sawtooth', gain:0.022, sweep: true },
    saturn:  { freq: 240, type:'sine', gain:0.016, mod2:true },
    ice:     { freq: 320, type:'sine', gain:0.011 },
    deep:    { freq: 45,  type:'sine', gain:0.02 },
  };
  return cfg[b.sound] || { freq: 120 + Math.random()*80, type:'sine', gain:0.012 };
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 120; filter.Q.value = 2;
  filter.connect(masterGain);
  humOsc = audioCtx.createOscillator(); humOsc.type='sine'; humOsc.frequency.value=32;
  humGain = audioCtx.createGain(); humGain.gain.value=0.02;
  humOsc.connect(humGain); humGain.connect(filter); humOsc.start();
  lfoOsc = audioCtx.createOscillator(); lfoOsc.type='sine'; lfoOsc.frequency.value=0.05;
  lfoGain = audioCtx.createGain(); lfoGain.gain.value=8;
  lfoOsc.connect(lfoGain); lfoGain.connect(humOsc.frequency); lfoOsc.start();
  const bufferSize = audioCtx.sampleRate*2;
  const noiseBuffer = audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  noiseSource = audioCtx.createBufferSource(); noiseSource.buffer=noiseBuffer; noiseSource.loop=true;
  noiseGain = audioCtx.createGain(); noiseGain.gain.value=0.008;
  const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type='bandpass'; noiseFilter.frequency.value=400; noiseFilter.Q.value=0.5;
  noiseSource.connect(noiseGain); noiseGain.connect(noiseFilter); noiseFilter.connect(masterGain); noiseSource.start();

  // per-planet sounds
  bodies.forEach(b=>{
    if(b.isMoon) return;
    const cfg = planetSoundConfig(b);
    const osc = audioCtx.createOscillator(); osc.type = cfg.type;
    osc.frequency.value = cfg.freq;
    const g = audioCtx.createGain(); g.gain.value = 0;
    const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = cfg.freq*1.2; f.Q.value = 6;
    // extra lfo for Jupiter wobble / Saturn shimmer
    let modOsc=null, modGain=null;
    if(cfg.sweep){
      modOsc = audioCtx.createOscillator(); modOsc.type='sine'; modOsc.frequency.value=0.35;
      modGain = audioCtx.createGain(); modGain.gain.value=35;
      modOsc.connect(modGain); modGain.connect(osc.frequency); modOsc.start();
    } else if(cfg.mod2){
      modOsc = audioCtx.createOscillator(); modOsc.type='sine'; modOsc.frequency.value=0.7;
      modGain = audioCtx.createGain(); modGain.gain.value=12;
      modOsc.connect(modGain); modGain.connect(f.frequency); modOsc.start();
    }
    osc.connect(f); f.connect(g); g.connect(masterGain);
    osc.start();
    planetSounds[b.name] = { osc, gain:g, filter:f, cfg, modOsc, modGain };
  });

  schedulePings();
}
function updatePlanetSounds(){
  if(!audioCtx || !soundEnabled) return;
  const camPos = camera.position;
  bodies.forEach(b=>{
    if(b.isMoon) return;
    const ps = planetSounds[b.name];
    if(!ps) return;
    if(soloPlanet && soloPlanet !== b.name){
      ps.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
      return;
    }
    if(b.exploded){ ps.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.2); return; }
    const wp = new THREE.Vector3(); b.tiltGroup.getWorldPosition(wp);
    const d = camPos.distanceTo(wp);
    // base ambient + proximity boost; solo boosts
    const soloBoost = soloPlanet===b.name ? 1.6 : 1;
    const proximity = THREE.MathUtils.clamp( (60 - d)/60, 0, 1);
    const ambientLevel = 0.04; // faint background for all planets
    const target = (ambientLevel + proximity*0.18) * ps.cfg.gain * 6 * soloBoost;
    // smooth
    ps.gain.gain.linearRampToValueAtTime(Math.min(target, 0.28), audioCtx.currentTime + 0.4);
    // Jupiter/Saturn extra sweep intensity scales with speed
    if(ps.cfg.sweep && ps.modGain) ps.modGain.gain.value = 30 + Math.sin(Date.now()*0.0007)*12;
  });
}
function setSoloPlanet(name){
  if(soloPlanet===name) soloPlanet=null;
  else soloPlanet=name;
  document.getElementById('infoSoundBtn').textContent = soloPlanet ? '🔈 Unsolo' : '🔊 Solo sound';
  if(soloPlanet && soundEnabled && !audioCtx) initAudio();
  if(soloPlanet && soundEnabled && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function schedulePings(){
  if(!audioCtx || !soundEnabled) return;
  const delay=3+Math.random()*12;
  setTimeout(()=>{ if(!soundEnabled) return; playPing(); schedulePings(); }, delay*1000);
}
function playPing(){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), pf=audioCtx.createBiquadFilter();
  pf.type='bandpass'; pf.frequency.value=800+Math.random()*1200; pf.Q.value=10;
  osc.type='sine'; osc.frequency.value=pf.frequency.value;
  osc.connect(gain); gain.connect(pf); pf.connect(masterGain);
  const now=audioCtx.currentTime;
  gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(0.03,now+0.02); gain.gain.exponentialRampToValueAtTime(0.0001,now+2.5);
  osc.start(now); osc.stop(now+3);
}
function playCrashSound(intensity){
  if(!audioCtx || !soundEnabled) return;
  const now=audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain=audioCtx.createGain(); const f=audioCtx.createBiquadFilter();
  osc.type='sawtooth'; osc.frequency.setValueAtTime(120+intensity*400, now); osc.frequency.exponentialRampToValueAtTime(30, now+0.6);
  f.type='lowpass'; f.frequency.value=1200;
  gain.gain.setValueAtTime(0.35*intensity, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.9);
  osc.connect(f); f.connect(gain); gain.connect(masterGain);
  osc.start(now); osc.stop(now+1);
  const bufferSize = Math.floor(audioCtx.sampleRate*0.3);
  const buf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0); for(let i=0;i<bufferSize;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2);
  const src = audioCtx.createBufferSource(); src.buffer=buf;
  const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.25*intensity, now); g2.gain.exponentialRampToValueAtTime(0.001, now+0.5);
  src.connect(g2); g2.connect(masterGain); src.start(now);
}
function toggleSound(){
  if(!audioCtx){ initAudio(); soundEnabled=true; masterGain.gain.value=0.15; }
  else if(soundEnabled){ masterGain.gain.value=0; soundEnabled=false; }
  else { masterGain.gain.value=0.15; soundEnabled=true; schedulePings(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  updateSoundButton();
}
function updateSoundButton(){
  const btn=document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Sound';
  btn.classList.toggle('muted', !soundEnabled);
}

/* ---------- Tooltip & Raycasting ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null;
let tapTooltipTimeout = null;

function onMove(e){
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', e=>{ if(e.touches[0]) onMove(e.touches[0]); }, {passive:true});

function showTapTooltip(target, isHover) {
  if(tapTooltipTimeout) clearTimeout(tapTooltipTimeout);
  const periodDays = target.period;
  const years = (periodDays/365.25).toFixed(2);
  tooltip.innerHTML =
    `<h3>${target.name}</h3>` +
    `<div class="row"><span><b>Period</b></span><span>${periodDays.toFixed(1)} d</span></div>` +
    (target.isMoon ? `<div class="row"><span><b>Parent</b></span><span>${target.parent?target.parent.name:'Sun'}</span></div>` : `<div class="row"><span><b>Distance</b></span><span>${(target.dist/DIST_SCALE).toFixed(2)} AU</span></div>`) +
    (target.tilt!=null ? `<div class="row"><span><b>Tilt</b></span><span>${target.tilt}°</span></div>` : '') +
    `<div style="margin-top:6px;color:#cfd8dc">${target.info}</div>` +
    (!target.isMoon ? `<div style="margin-top:6px;color:#ffd54a;font-size:11px;">Click to fly · ${physicsEnabled?'Drag':''} · Tap for facts</div>` : '');
  tooltip.style.display='block';
  let lx = (mouse.x*0.5+0.5)*window.innerWidth + 16;
  let ly = (-mouse.y*0.5+0.5)*window.innerHeight - 20;
  if(lx + 260 > window.innerWidth) lx = window.innerWidth - 270;
  if(ly + 140 > window.innerHeight) ly = window.innerHeight - 150;
  tooltip.style.left = lx + 'px';
  tooltip.style.top  = ly + 'px';
  if(!isHover){
    tapTooltipTimeout = setTimeout(()=>{ if(hovered!==target) tooltip.style.display='none'; }, 3200);
  }
}
function getBodyFromHit(hitObject){
  let obj = hitObject;
  while(obj && !bodies.find(b=>b.mesh===obj)) obj = obj.parent;
  return bodies.find(b=>b.mesh===obj);
}
function onTap(e) {
  const clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
  if (clientX==null) return;
  mouse.x = (clientX/window.innerWidth)*2-1;
  mouse.y = -(clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = bodies.filter(b=>!b.exploded).map(b=>b.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length) {
    const target = getBodyFromHit(hits[0].object);
    if (target) {
      if(target.exploded) return;
      showTapTooltip(target, false);
      hovered = target;
      showInfo(target);
      if(!dragDidMove && !target.isMoon) flyToBody(target);
      else if(target.isMoon && target.parent) { showInfo(target); flyToBody(target.parent); }
    }
  } else {
    // click empty space hides info?
  }
}

// Fly-to animation
let flyAnim = null;
function flyToBody(body){
  if(flyAnim) return;
  // body may be planet (tiltGroup) or moon parent
  const worldPos = new THREE.Vector3();
  const src = body.tiltGroup || body.mesh;
  src.getWorldPosition(worldPos);
  const targetPos = worldPos.clone();
  const bodyRad = body.radius;
  const distWanted = Math.max(bodyRad*6 + 6, 8);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if(dir.lengthSq()<0.001) dir.set(0,0.8,1).normalize();
  const endPos = targetPos.clone().add(dir.multiplyScalar(distWanted)).add(new THREE.Vector3(0, distWanted*0.22, 0));
  flyAnim = {
    t:0, duration:1.5,
    startPos: camera.position.clone(),
    endPos,
    startTarget: controls.target.clone(),
    endTarget: targetPos.clone()
  };
  controls.enabled = false;
}
function cancelFly(){
  flyAnim=null;
  controls.enabled = !draggedBody;
}
function updateFly(dt){
  if(!flyAnim) return;
  flyAnim.t += dt / flyAnim.duration;
  let p = Math.min(flyAnim.t,1);
  p = p<0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
  camera.position.lerpVectors(flyAnim.startPos, flyAnim.endPos, p);
  controls.target.lerpVectors(flyAnim.startTarget, flyAnim.endTarget, p);
  controls.update();
  if(flyAnim.t>=1){ flyAnim=null; controls.enabled = !draggedBody; if(selectedBody) showInfo(selectedBody); }
}

let flyClickHandler = (e)=>{
  if(dragDidMove) return;
  onTap(e);
};
window.addEventListener('click', flyClickHandler);
window.addEventListener('touchend', (e)=>{
  if(e.changedTouches[0] && !dragDidMove) onTap(e.changedTouches[0]);
}, {passive:true});

function updateTooltip(){
  if (window.matchMedia('(pointer: coarse)').matches) return;
  if(draggedBody || flyAnim) return;
  raycaster.setFromCamera(mouse, camera);
  const meshes = bodies.filter(b=>!b.exploded).map(b=>b.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  let target = null;
  if(hits.length) target = getBodyFromHit(hits[0].object);
  if(target !== hovered){
    hovered = target;
    if(target && !target.exploded){
      showTapTooltip(target, true);
    } else {
      tooltip.style.display='none';
      if(tapTooltipTimeout){ clearTimeout(tapTooltipTimeout); tapTooltipTimeout=null; }
    }
  }
  if(hovered && hovered.mesh.visible){
    const wp = new THREE.Vector3(); hovered.mesh.getWorldPosition(wp);
    wp.project(camera);
    let lx = (wp.x*0.5+0.5)*window.innerWidth + 16;
    let ly = (-wp.y*0.5+0.5)*window.innerHeight - 20;
    if(lx + 270 > window.innerWidth) lx = (mouse.x*0.5+0.5)*window.innerWidth - 276;
    tooltip.style.left = lx+'px';
    tooltip.style.top = ly+'px';
  }
}

/* ---------- Drag planets (physics) ---------- */
let draggedBody = null;
let dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
let dragOffset = new THREE.Vector3();
let dragDidMove = false;
let dragStartPos = new THREE.Vector3();

canvas.addEventListener('pointerdown', (e)=>{
  if(!physicsEnabled) return;
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const candidates = bodies.filter(b=>!b.isMoon && !b.exploded).map(b=>b.mesh);
  const hits = raycaster.intersectObjects(candidates, false);
  if(hits.length){
    const body = bodies.find(b=>b.mesh===hits[0].object);
    if(body){
      draggedBody = body;
      dragDidMove = false;
      dragStartPos.copy(body.tiltGroup.position);
      controls.enabled = false;
      canvas.classList.add('dragging');
      const intersect = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, intersect);
      dragOffset.copy(intersect).sub(body.tiltGroup.position);
      body.isPhysics = true;
      body.velocity.set(0,0,0);
      if(flyAnim) cancelFly();
      e.preventDefault();
    }
  }
});
canvas.addEventListener('pointermove', (e)=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  if(draggedBody){
    const intersect = new THREE.Vector3();
    raycaster.setFromCamera(mouse, camera);
    if(raycaster.ray.intersectPlane(dragPlane, intersect)){
      const newPos = intersect.clone().sub(dragOffset);
      const r = Math.sqrt(newPos.x*newPos.x + newPos.z*newPos.z);
      if(r < SUN_RADIUS + draggedBody.radius + 1){
        const ang = Math.atan2(newPos.z, newPos.x);
        const nr = SUN_RADIUS + draggedBody.radius + 1.2;
        newPos.x = Math.cos(ang)*nr;
        newPos.z = Math.sin(ang)*nr;
      }
      if(!dragDidMove && newPos.distanceTo(dragStartPos)>0.15) dragDidMove = true;
      draggedBody.tiltGroup.position.copy(newPos);
      draggedBody.dist = Math.sqrt(newPos.x*newPos.x + newPos.z*newPos.z);
      draggedBody.angle = Math.atan2(newPos.z, newPos.x);
      draggedBody.tiltGroup.position.y = 0;
    }
  }
  onMove(e);
});
function endDrag(e){
  if(draggedBody){
    if(dragDidMove){
      const r = draggedBody.dist;
      const vMag = Math.sqrt(MU / Math.max(r, 2));
      draggedBody.velocity.set(-Math.sin(draggedBody.angle)*vMag, 0, Math.cos(draggedBody.angle)*vMag);
      setTimeout(()=> dragDidMove=false, 250);
    }
    draggedBody = null;
    canvas.classList.remove('dragging');
    if(!flyAnim) controls.enabled = true;
  } else {
    dragDidMove = false;
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

/* ---------- Explosions ---------- */
const explosions = [];
function createExplosion(pos, color, intensity){
  const count = 80 + Math.floor(intensity*60);
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count*3);
  const vels = [];
  const cols = new Float32Array(count*3);
  const col = new THREE.Color(color);
  for(let i=0;i<count;i++){
    positions[i*3]=pos.x; positions[i*3+1]=pos.y; positions[i*3+2]=pos.z;
    const dir = new THREE.Vector3((Math.random()-0.5),(Math.random()-0.5),(Math.random()-0.5)).normalize();
    dir.multiplyScalar(4 + Math.random()*18*intensity);
    dir.y += (Math.random()-0.5)*4;
    vels.push(dir);
    const c = col.clone().multiplyScalar(0.7+Math.random()*0.6);
    if(i< count*0.3) c.lerp(new THREE.Color(0xffffff), 0.5);
    cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  const mat = new THREE.PointsMaterial({ size: 0.45, vertexColors:true, transparent:true, opacity:1, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  explosions.push({ points, velocities: vels, age:0, maxAge:1.6+intensity*0.7, mat });
  const flash = new THREE.PointLight(col, 4*intensity, 60);
  flash.position.copy(pos);
  scene.add(flash);
  setTimeout(()=> scene.remove(flash), 300);
  playCrashSound(intensity);
}

function updateExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){
    const ex = explosions[i];
    ex.age += dt;
    const t = ex.age / ex.maxAge;
    if(t>=1){
      scene.remove(ex.points);
      explosions.splice(i,1);
      continue;
    }
    const pos = ex.points.geometry.attributes.position;
    for(let j=0;j<ex.velocities.length;j++){
      ex.velocities[j].y -= 1.2*dt;
      pos.array[j*3] += ex.velocities[j].x * dt;
      pos.array[j*3+1] += ex.velocities[j].y * dt;
      pos.array[j*3+2] += ex.velocities[j].z * dt;
      ex.velocities[j].multiplyScalar(0.995);
    }
    pos.needsUpdate = true;
    ex.mat.opacity = 1 - t;
    ex.mat.size = 0.45 * (1 + t*0.6);
  }
}

function checkCollisions(){
  for(const b of bodies){
    if(b.exploded || b.isMoon) continue;
    const p = b.tiltGroup.position;
    const distToSun = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
    if(distToSun < SUN_RADIUS + b.radius + 0.2){
      const wp = p.clone();
      b.exploded = true; b.mesh.visible = false;
      createExplosion(wp, b.color, 1.4);
    }
  }
  const actives = bodies.filter(b=>!b.isMoon && !b.exploded);
  for(let i=0;i<actives.length;i++){
    for(let j=i+1;j<actives.length;j++){
      const a = actives[i], c = actives[j];
      if(a.exploded||c.exploded) continue;
      const pa = a.tiltGroup.position, pc = c.tiltGroup.position;
      const dx = pa.x-pc.x, dy = pa.y-pc.y, dz = pa.z-pc.z;
      const d = Math.sqrt(dx*dx+dy*dy+dz*dz);
      const minD = a.radius + c.radius + 0.15;
      if(d < minD){
        const mid = pa.clone().add(pc).multiplyScalar(0.5);
        const intensity = Math.min(1.5, (a.radius + c.radius)/2);
        a.exploded = true; a.mesh.visible=false;
        c.exploded = true; c.mesh.visible=false;
        createExplosion(mid, a.color, intensity);
      }
    }
  }
}

/* ---------- Animation loop ---------- */
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dtRaw = Math.min((now-last)/1000, 0.1); last = now;
  const dt = paused ? 0 : dtRaw;

  const tSec = now*0.001;
  sun.rotation.y += dtRaw*0.05; // sun still slowly spins even when paused? keep but use dtRaw
  if(coronaMesh) coronaMesh.material.uniforms.time.value = tSec;
  if(coronaMat2){ coronaMat2.opacity = 0.08 + Math.sin(tSec*0.9)*0.03; }
  coronaSprites.forEach((s,i)=>{ s.material.opacity = 0.12 + Math.sin(tSec*1.1+i)*0.06; const sc = 40+i*14 + Math.sin(tSec*0.7+i)*3; s.scale.set(sc,sc,1); });
  glow.scale.set(30+Math.sin(tSec*1.3)*2, 30+Math.sin(tSec*1.3)*2,1);

  for(let i=flares.length-1;i>=0;i--){
    const f = flares[i];
    f.life += dtRaw;
    f.pos.add(f.vel.clone().multiplyScalar(dtRaw));
    f.sprite.position.copy(f.pos);
    const prog = f.life / f.maxLife;
    f.sprite.material.opacity = 1-prog;
    f.sprite.scale.set(2+prog*6,2+prog*6,1);
    f.vel.multiplyScalar(0.992);
    if(f.life >= f.maxLife){ scene.remove(f.sprite); flares.splice(i,1); }
  }

  if(asteroidPoints && dt>0){
    const pos = asteroidPoints.geometry.attributes.position;
    for(let i=0;i<asteroidData.length;i++){
      const ad = asteroidData[i];
      ad.angle += ad.speed * speed * BASE_SPEED * dt * 0.6;
      pos.array[i*3] = Math.cos(ad.angle)*ad.dist;
      pos.array[i*3+2] = Math.sin(ad.angle)*ad.dist;
    }
    pos.needsUpdate = true;
  }

  if(!paused){
    if(physicsEnabled){
      for(const b of bodies){
        if(b.isMoon){
          const dir = b.retro ? -1 : 1;
          b.angle += dir * (2*Math.PI/b.period) * (speed*BASE_SPEED*dt);
          b.mesh.position.set(Math.cos(b.angle)*b.dist, 0, Math.sin(b.angle)*b.dist);
          continue;
        }
        if(b.exploded) continue;
        if(b === draggedBody) continue;
        if(!b.isPhysics) continue;
        const p = b.tiltGroup.position;
        const r = Math.sqrt(p.x*p.x + p.z*p.z + p.y*p.y);
        if(r>0.1){
          const accelMag = MU / (r*r);
          const ax = -p.x/r * accelMag;
          const az = -p.z/r * accelMag;
          const ay = -p.y/r * accelMag;
          b.velocity.x += ax * dt;
          b.velocity.y += ay * dt;
          b.velocity.z += az * dt;
        }
        p.x += b.velocity.x * dt;
        p.y += b.velocity.y * dt;
        p.z += b.velocity.z * dt;
        b.velocity.y *= 0.98;
        p.y *= 0.99;
        b.dist = Math.sqrt(p.x*p.x + p.z*p.z);
        b.angle = Math.atan2(p.z, p.x);
      }
      checkCollisions();
    } else {
      simDays += speed*BASE_SPEED*dt;
      for(const b of bodies){
        if(b.exploded) continue;
        if(b.isMoon){
          const dir = b.retro ? -1 : 1;
          b.angle += dir * (2*Math.PI/b.period) * (speed*BASE_SPEED*dt);
          b.mesh.position.set(Math.cos(b.angle)*b.dist, 0, Math.sin(b.angle)*b.dist);
        } else {
          if(b === draggedBody) continue;
          b.angle += (2*Math.PI/b.period) * (speed*BASE_SPEED*dt);
          b.tiltGroup.position.set(Math.cos(b.angle)*b.dist, 0, Math.sin(b.angle)*b.dist);
        }
      }
    }
    // self rotation (axial spin) — tiltGroup already tilted, spin mesh
    for(const b of bodies) if(!b.exploded) b.mesh.rotation.y += dt*0.1 * (b.name==='Venus' ? -0.3 : 1);
    updateExplosions(dt);
  } else {
    // still update explosions fading even when paused? use dtRaw for visual
    updateExplosions(dtRaw*0.3);
  }

  updatePlanetSounds();
  updateFly(dtRaw);
  if(!flyAnim) {
    moveCamera(dtRaw);
    controls.update();
  }
  updateTooltip();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---------- Resume audio on first interaction (iOS) ---------- */
function resumeAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  window.removeEventListener('touchstart', resumeAudio);
  window.removeEventListener('click', resumeAudio);
  window.removeEventListener('keydown', resumeAudio);
}
window.addEventListener('touchstart', resumeAudio, {once: true});
window.addEventListener('click', resumeAudio, {once: true});
window.addEventListener('keydown', resumeAudio, {once: true});

/* ---------- Resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
